      '<button type="button" class="dlg-next" aria-label="Continue"><span aria-hidden="true">NEXT</span> <span class="tri" aria-hidden="true">▼</span></button>';
    nameEl = el.querySelector('.dlg-name');
    nameTxt = nameEl.querySelector('span');
    portraitEl = el.querySelector('.dlg-portrait');
    textEl = el.querySelector('.dlg-typed');
    nextBtn = el.querySelector('.dlg-next');
    el.addEventListener('click', e => { if (e.target.closest('.dlg-next')) return; advance(); });
    nextBtn.addEventListener('click', e => { e.stopPropagation(); advance(); });
  }
  function mount(container) {
    if (!el) build();
    if (!active && !lines.length) {   // don't carry the previous scene's last line into a new scene
      textEl.textContent = ''; nameTxt.textContent = ''; portraitEl.innerHTML = '';
      nameEl.className = 'dlg-name'; el.classList.add('narration'); el.classList.add('static');
    }
    container.appendChild(el);
  }
  function unmount() { stop(); if (el) el.remove(); }
  function stop() {
    clearTimeout(timer); timer = null;
    if (el) el.classList.remove('typing');
    typing = false; active = false; lines = []; onDone = null; pendingHold = null;
  }
  // Play a list of lines. `done` runs after the last line (or as soon as it is shown, with holdLast).
  function play(seq, done, opts = {}) {
    stop();
    lines = seq; idx = 0; onDone = done || null; holdLast = !!opts.holdLast; active = true;
    show();
  }
  // Show a single line that does not advance (used for trial feedback).
  function say(line) { stop(); lines = [line]; idx = 0; render(line, false); }

  function show() {
    const line = lines[idx];
    const hold = holdLast && idx === lines.length - 1;
    state.dialogueIndex = idx;
    render(line, !hold);
    if (hold) {
      active = false; pendingHold = onDone; onDone = null;
      if (!typing) firePending();
    }
    if (typeof line.on === 'function') line.on(line);
  }
  function firePending() { const cb = pendingHold; pendingHold = null; if (cb) cb(); }
  function render(line, advanceable) {
    const cast = CAST[line.who] || CAST.narration;
    const name = line.name != null ? line.name : (typeof cast.name === 'function' ? cast.name() : cast.name);
    el.classList.toggle('narration', !!cast.narration);
    el.classList.toggle('static', !advanceable);
    nameEl.className = 'dlg-name ' + (line.tag || cast.tag || '') + (line.glitch || line.name ? ' glitchy' : '');
    nameTxt.textContent = name || '';
    if (cast.sprite && (line.mood || line.prop !== undefined)) setSprite(cast.sprite, { mood: line.mood, prop: line.prop });
    const mood = line.mood || (cast.sprite && sprites[cast.sprite] ? sprites[cast.sprite].mood : undefined);
    portraitEl.className = 'dlg-portrait ' + (cast.portraitClass || '');
    portraitEl.innerHTML = cast.portrait ? cast.portrait(mood) : '';
    announce((name ? name.replace(/[\u0300-\u036f]/g, '') + ': ' : '') + line.text);
    shownAt = performance.now();
    if (line.glitch) { glitchFx(); Sound.play('glitch'); }
    type(line.text, line.speed || 1, !!line.glitch);
  }
  // Typewriter: one letter at a time, a key click per letter, little pauses after punctuation.
  const JUNK = '▓▒░#%&@$*';
  const junk = () => JUNK[Math.floor(Math.random() * JUNK.length)] + JUNK[Math.floor(Math.random() * JUNK.length)];
  function type(str, speed, glitchy) {
    clearTimeout(timer);
    fullText = str;
    if (REDUCED || TYPE_SPEED_MS <= 0) { textEl.textContent = str; typing = false; el.classList.remove('typing'); return; }
    const chars = Array.from(str);
    const base = TYPE_SPEED_MS * speed;
    let i = 0;
    typing = true;
    el.classList.add('typing');
    textEl.textContent = '';
    const tick = () => {
      i++;
      textEl.textContent = chars.slice(0, i).join('') + (glitchy && i < chars.length ? junk() : '');
      const ch = chars[i - 1], nx = chars[i];
      if (ch.trim() && (speed >= 1.8 || i % 2 === 1)) Sound.play('key');
      if (i >= chars.length) { finishTyping(); return; }
      let wait = base;
      if ('.!?'.indexOf(ch) >= 0) wait += (nx === '.' || nx === '!' || nx === '?') ? base * 2.5 : base * 7;
      else if (ch === ',' || ch === ':') wait += base * 4;
      timer = setTimeout(tick, wait);
    };
    timer = setTimeout(tick, base);
  }
  function finishTyping() {
    clearTimeout(timer); timer = null; typing = false;
    el.classList.remove('typing');
    textEl.textContent = fullText;
    if (pendingHold) firePending();
  }
  function advance() {
    if (state.busy || !el) return;
    if (typing) { finishTyping(); return; }
    if (!active) return;
    if (performance.now() - shownAt < 200) return;   // avoids accidental double-tap skips
    idx++;
    Sound.play('ret');
    if (idx >= lines.length) {
      active = false;
      el.classList.add('static');
      const cb = onDone; onDone = null;
      if (cb) cb();
      return;
    }
    show();
  }
  function flipName(newName) {
    if (!el) return;
    nameEl.classList.remove('flip'); void nameEl.offsetWidth; nameEl.classList.add('flip');
    setTimeout(() => {
      nameTxt.textContent = newName;
      nameEl.className = 'dlg-name tag-pink revealed flip';
      announce('Name revealed: ' + newName);
      Sound.play('reveal');
      burstAt(nameEl, { n: 10, kinds: ['heart', 'sparkle', 'star'], spread: 60 });
    }, 230);
  }
  return {
    mount, unmount, play, say, stop, advance, flipName,
    canAdvance: () => (active || typing) && !state.busy,
    get nextBtn() { return nextBtn; },
    get index() { return idx; },
    get el() { return el; }
  };
})();

/* ---- Investigation ---- */
function inspectClue(id, scene) {
  if (state.busy) return;
  const clue = CLUES.find(c => c.id === id);
  if (!clue) return;
  const btn = scene.querySelector(`[data-clue="${id}"]`);
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');

  if (state.clues.has(id)) {   // already collected: no double counting
    Sound.play('again');
    Dialogue.play([{ who: 'you', text: `${clue.lines[0].text} (Already in your case file ✓)` }]);
    return;
  }
  state.clues.add(id);
  Sound.play('clue');
  btn.classList.add('found');
  btn.setAttribute('aria-label', `${clue.name}: clue collected`);
  burstAt(btn, { n: 10, kinds: ['star', 'sparkle'] });
  flyToSlot(btn, id, scene);
  updateCounter(scene);

  const seq = clue.lines.map(l => Object.assign({}, l));
  if (state.clues.size === CLUES.length) {
    SCRIPT.allFound().forEach(l => seq.push(l));

}
function flyToSlot(btn, id, scene) {
  const slot = scene.querySelector(`[data-slot="${id}"]`);
  const clue = CLUES.find(c => c.id === id);
  const fill = () => {
    slot.classList.add('filled');
    slot.innerHTML = pixelSVG(id);

    if (lab) { lab.textContent = clue.label; lab.classList.add('found'); }
    const sr = scene.querySelector(`[data-slot-sr="${id}"]`);
    if (sr) sr.textContent = `${clue.name}: found`;
  };
  if (REDUCED) { fill(); return; }
  const g = root.getBoundingClientRect(), a = btn.getBoundingClientRect(), b = slot.getBoundingClientRect();
  const fly = document.createElement('div');
  fly.className = 'fly';
  fly.innerHTML = pixelSVG(id);
  Object.assign(fly.style, { left: (a.left - g.left) + 'px', top: (a.top - g.top) + 'px', width: a.width + 'px', height: a.height + 'px' });
  root.appendChild(fly);
  fly.getBoundingClientRect();
  const sc = (b.width / a.width) * 0.8;
  fly.style.transform = `translate(${b.left - a.left + b.width * 0.1}px, ${b.top - a.top + b.height * 0.1}px) scale(${sc})`;
  fly.style.opacity = '.6';

}

  const fb = scene.querySelector('[data-feedback]');

  Dialogue.unmount();

  if (pan) pan.classList.add('pan-away');
  const layer = scene.querySelector('[data-letter]');
  layer.innerHTML = `<div class="letter-wrap"><div class="letter" role="dialog" aria-modal="true" aria-label="A letter with a pink peony">
      <div class="letter-seal" aria-hidden="true">${pixelSVG('heart')}</div>

      <p class="sr-only">${escapeHTML(LETTER_TEXT)}</p>
      <button type="button" class="btn pink" data-letter-done hidden>FOLD THE LETTER ♡</button>
    </div><div class="peony" aria-hidden="true">${peonySVG()}</div></div>`;
  layer.hidden = false;
  Sound.play('paper');
  const textEl = layer.querySelector('.lt-typed'), btn = layer.querySelector('[data-letter-done]');
  const chars = Array.from(LETTER_TEXT);
  let i = 0, done = false;
  const finish = () => {
    if (done) return;
    done = true;
    textEl.textContent = LETTER_TEXT;
    btn.hidden = false;
    try { btn.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
    later(() => focusKb(btn), 40);
  };
  const tick = () => {
    if (done) return;
    i++;
    textEl.textContent = chars.slice(0, i).join('');
    const ch = chars[i - 1];
    if (ch && ch.trim() && i % 2) Sound.play('key');
    if (i >= chars.length) { finish(); return; }
    later(tick, '.!?'.indexOf(ch) >= 0 ? 300 : ch === ',' ? 150 : ch === '\n' ? 140 : 40);
  };
  if (REDUCED) finish(); else later(tick, 700);
  layer.querySelector('.letter').addEventListener('click', e => { if (!e.target.closest('[data-letter-done]')) finish(); });
  const onKey = e => { if (!done && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); finish(); } };
  document.addEventListener('keydown', onKey);
  sceneCleanup.push(() => document.removeEventListener('keydown', onKey));
  btn.addEventListener('click', () => {
    Sound.play('paper');
    layer.classList.add('folding');
    later(() => {
      layer.hidden = true;
      layer.classList.remove('folding');
      if (pan) pan.classList.remove('pan-away');          // the camera pans back to him...
      later(transformBunny, 1300);                        // ...and he transforms
      later(() => {
        Dialogue.mount(scene.querySelector('[data-dlg]'));
        Dialogue.play(SCRIPT.transform(), () => showTheEnd(scene));
        focusKb(Dialogue.nextBtn);
      }, 1300 + 2900);
    }, 650);
  });
}

  const overlap = (x, y, w, h, r) => x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y;

  function physics(dt) {
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    P.vx = dir * SPEED;
    if (dir) P.face = dir;
    P.walkT = dir && P.onGround ? P.walkT + dt : 0;
    P.coyote = P.onGround ? COYOTE : Math.max(0, P.coyote - dt);
    if (keys.jumpPressed) { P.buffer = BUFFER; keys.jumpPressed = false; } else P.buffer = Math.max(0, P.buffer - dt);
    if (P.buffer > 0 && P.coyote > 0) {
      P.vy = JUMP_V; P.buffer = 0; P.coyote = 0; P.onGround = false; P.ground = null;
      Sound.play('jump');
    }
    if (!keys.jump && P.vy < -120) P.vy += GRAV * 1.6 * dt;     // short hop if jump is let go early
    P.vy = Math.min(P.vy + GRAV * dt, MAX_FALL);
    if (P.onGround && P.ground && P.ground.move) P.x += P.ground.x - P.ground.px;   // ride moving blocks

    P.x += P.vx * dt;
    P.x = Math.max(WALL_L, Math.min(WALL_R - PW, P.x));
    for (const p of plats) {
      if (!solid(p) || p.falling || !overlap(P.x, P.y, PW, PH, p)) continue;
      if (P.x + PW / 2 < p.x + p.w / 2) P.x = p.x - PW; else P.x = p.x + p.w;
    }

    const prevFeet = P.y + PH, prevHead = P.y;
    P.y += P.vy * dt;
    const wasGround = P.onGround;
    P.onGround = false;
    for (const p of plats) {
      if (p.falling) continue;
      if (!(P.x + PW > p.x + 2 && P.x < p.x + p.w - 2)) continue;
      if (P.vy >= 0 && prevFeet <= p.y + 0.5 && P.y + PH >= p.y) {
        P.y = p.y - PH; P.vy = 0; P.onGround = true; P.ground = p;
      } else if (solid(p) && P.vy < 0 && prevHead >= p.y + p.h - 0.5 && P.y < p.y + p.h) {
        // corner assist: if you only clip the edge of the narrow gap, slide into it instead of bonking
        if (p.kind === 'slab' && !p.sealed) {
          if (p.x + p.w === GAP_X1 && P.x > GAP_X1 - 12) { P.x = GAP_X1 - 2; continue; }
          if (p.x === GAP_X2 && P.x + PW < GAP_X2 + 12) { P.x = GAP_X2 + 2 - PW; continue; }
        }
        P.y = p.y + p.h; P.vy = 0;
      }
    }
    if (!P.onGround) P.ground = null;
    if (P.onGround && !wasGround) Sound.play('land');
    if (P.onGround && P.ground && P.ground.kind === 'crumble' && !P.ground.crumbleT) P.ground.crumbleT = 0.001;

    if (!alerted && P.y + PH < LAVA_TRIGGER_Y) startLava();
    if (!state.sacrificed && P.onGround && P.ground && P.ground.kind === 'slab') { startSacrifice(); return; }
    if (P.onGround && P.ground && P.ground.kind === 'flag' && !checkpoint) {
      checkpoint = { x: P.ground.x + 14, y: P.ground.y - PH, lava: P.ground.y + 190 };
      Sound.play('shimmer');
      if (B.alive) { B.say = 'Checkpoint!'; B.sayT = 1.6; }
      announce('Checkpoint! The lantern is lit.');
    }
    if (P.onGround && P.ground && P.ground.kind === 'top') lava.stopped = true;
    for (const k of HAZARDS) if (overlap(P.x + 2, P.y + 3, PW - 4, PH - 3, k)) { die('brick'); return; }
    const near = overlap(P.x, P.y, PW, PH, DOOR) && P.onGround;
    if (near !== atDoor) {
      atDoor = near;
      el.openBtn.hidden = !near;
      if (near && !doorHinted) { doorHinted = true; announce('You reached the glowing door. Press Enter or the OPEN button to open it.'); }
    }
    if (lava.active && P.y + PH > lava.y + 6) die();
  }

  /* ---- the bunny follows right behind you ---- */
  function updateBunny(dt) {
    if (B.sayT > 0) B.sayT -= dt;
    if (B.sinking) {
      B.y += 24 * dt;
      B.alpha = Math.max(0, B.alpha - dt * 0.45);
      if (B.alpha <= 0) B.sinking = false;
      return;
    }
    if (!B.alive || B.stay) return;
    if (mode !== 'play' && mode !== 'intro') return;
    trail.push({ t: time, x: P.x, y: P.y });
    while (trail.length > 2 && trail[1].t < time - 0.4) trail.shift();
    const s = trail[0];
    let tx = s.x;
    const ty = s.y;
    if (Math.abs(ty - P.y) < 4 && Math.abs(tx - P.x) < 18) tx = P.x - P.face * 18;
    tx = Math.max(WALL_L, Math.min(WALL_R - PW, tx));
    const k = Math.min(1, dt * 12);
    if (Math.abs(tx - B.x) > 0.6) B.face = tx > B.x ? 1 : -1; else B.face = P.face;
    B.x += (tx - B.x) * k;
    B.y += (ty - B.y) * k;
    if (lava.active && B.y + PH > lava.y - 2) B.y = lava.y - PH - 2;
  }

  /* ---- lava ---- */

  function updateLava(dt) {

    const feet = P.y + PH;
    const base = (30 + Math.max(0, FLOOR_Y - feet) / (FLOOR_Y - DOOR.y) * 14) * lavaMul;
    const speed = base + Math.max(0, (lava.y - feet - 120) * 1.1);   // rushes up until it's right behind you
    lava.y = Math.max(200, lava.y - speed * dt);

  function updateEmbers(dt) {
    if (lava.active || engulfing) {

    for (const e of embers) { e.y += e.vy * dt; e.x += Math.sin(time * 3 + e.y * 0.1) * 8 * dt; e.life -= dt; }

  }
  function die(why) {

    clearKeys();
    Sound.play('burn');
    shake = 0.4;
    el.pad.hidden = true;
    el.lavaMsg.hidden = true;
    el.dead.querySelector('.dead-title').textContent = why === 'brick' ? 'OUCH! A RED BRICK!' : 'THE LAVA CAUGHT YOU!';
    el.deadSub.textContent = why === 'brick' ? "Red bricks are bad news. Jump over them! (The lava will be a little slower this time.)" : state.sacrificed
      ? "You promised you wouldn't look back... so keep going!"
      : checkpoint ? "Back to the lantern! (The lava will be a little slower this time.)"
      : "Don't give up, detective. (The lava will be a little slower this time.)";
    el.dead.hidden = false;
    announce('The lava caught you. Try again.');
    later(() => focusKb(el.dead.querySelector('[data-retry]')), 60);
  }
  function retry() {
    if (mode !== 'dead') return;
    el.dead.hidden = true;
    const cp = !!checkpoint;
    resetPlayer(cp);
    resetBunny();
    resetCrumbles();
    if (!cp) { alerted = false; Sound.music(null); }
    resetLava(cp);
    camY = targetCam();
    mode = 'play';
    el.pad.hidden = false;
    Sound.play('start');
    later(() => focusKb(el.pad.querySelector('[data-k="jump"]')), 60);
  }

  /* ---- the narrow gap: only one can pass ---- */
  function startSacrifice() {
    mode = 'cutscene';
    clearKeys();
    el.pad.hidden = true; el.padHint.hidden = true;
    B.x = (GAP_X1 + GAP_X2) / 2 - PW / 2; B.y = LEDGE_Y - PH; B.face = 1; B.stay = true; B.alive = true;
    lava.y = Math.max(lava.y, LEDGE_Y + 120);
    Sound.music('sad');
    Dialogue.mount(el.dlg);
    Dialogue.play(SCRIPT.sacrifice(), endSacrifice);
  }
  function engulf() {
    if (engulfing || !plats) return;
    engulfing = true;
    const ledge = plats.find(p => p.kind === 'ledge');
    if (ledge) { ledge.falling = true; ledge.vy = 0; }
    B.sinking = true; B.alive = false;
    Sound.play('crumble');
    later(() => Sound.play('burn'), 800);
    shake = 0.7;
  }
  function sealGap() {
    if (!plats || plats.some(p => p.sealed)) return;
    plats.push({ x: GAP_X1, y: SLAB_Y, w: GAP_X2 - GAP_X1, h: 16, kind: 'slab', sealed: true, bx: GAP_X1, px: GAP_X1, i: 99 });
    Sound.play('slam');
    shake = 0.35;
  }
  function endSacrifice() {
    if (!B.sinking && B.alive) engulf();
    sealGap();
    state.sacrificed = true;
    engulfing = false;
    B.alive = false; B.sinking = false; B.alpha = 0;
    checkpoint = { x: 188, y: SLAB_Y - PH, lava: SLAB_Y + 170 };
    lava.y = SLAB_Y + 170; lava.active = true; lava.stopped = false;
    Dialogue.unmount();
    mode = 'play';
    el.pad.hidden = false;
    Sound.music('obby');
    announce('Keep climbing!');
    later(() => focusKb(el.pad.querySelector('[data-k="jump"]')), 60);
  }

  /* ---- the locked door at the top ---- */
  function tryDoor() {
    if (mode !== 'play' || !atDoor) return;
    mode = 'locked';
    clearKeys();
    el.openBtn.hidden = true;
    el.pad.hidden = true; el.padHint.hidden = true;
    Sound.play('rattle');
    shake = 0.2;
    Dialogue.mount(el.dlg);
    Dialogue.play([{ who: 'narration', text: 'It seems that the door is locked with a passcode...' }], () => { Dialogue.unmount(); openKeypad(); });
    later(() => focusKb(Dialogue.nextBtn), 60);
  }
  function placeOpenBtn() {
    if (!el.openBtn || el.openBtn.hidden) return;
    el.openBtn.style.left = (offX + (DOOR.x + DOOR.w / 2) * scale) + 'px';
    el.openBtn.style.top = Math.max(4, (DOOR.y - camY) * scale - 8) + 'px';
  }
  function openKeypad() {
    mode = 'door';
    clearKeys();
    lava.stopped = true;
    el.pad.hidden = true; el.padHint.hidden = true;
    code = '';
    renderCode();
    el.keypad.querySelector('[data-kp-msg]').textContent = '';
    el.keypad.hidden = false;
    Sound.play('beep');
    Sound.music('doorwait');
    announce('The door is locked. Enter the two-digit code. Hint: ' + DOOR_HINT);
    later(() => focusKb(el.keypad.querySelector('[data-d="1"]')), 80);
  }
  function renderCode() {
    el.keypad.querySelectorAll('[data-kp-display] span').forEach((s, i) => { s.textContent = code[i] || '_'; });
  }
  function keypadKey(e) {
    if (e.target && e.target.closest && e.target.closest('.keypad button') && (e.key === 'Enter' || e.key === ' ')) return;   // the button handles it

    else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
    else if (e.key === 'Enter') { press('ok'); e.preventDefault(); }
  }
  function press(d) {
    if (mode !== 'door') return;
    if (d === 'del') code = code.slice(0, -1);
    else if (d === 'ok') { submit(); return; }
    else if (code.length < 2) code += d;
    Sound.play('beep');
    renderCode();
    if (code.length === 2) focusKb(el.keypad.querySelector('[data-d="ok"]'));   // so Enter submits for keyboard users
  }
  function submit() {
    if (mode !== 'door') return;
    const msg = el.keypad.querySelector('[data-kp-msg]');
    const disp = el.keypad.querySelector('[data-kp-display]');
    if (code.length < 2) { msg.className = 'kp-msg bad'; msg.textContent = 'Two digits, please!'; return; }
    const target = String(DOOR_CODE).padStart(2, '0');
    if (code === target) {
      mode = 'done';
      state.codeOK = true;
      msg.className = 'kp-msg good';
      msg.textContent = '✓ UNLOCKED';
      disp.classList.add('ok');
      Sound.music(null);
      Sound.play('unlock');
      doorOpenT = 0.01;
      announce('Unlocked!');
      later(() => { el.keypad.hidden = true; }, 1000);
      later(() => goTo('recollect', 'light'), 2200);
      return;
    }
    state.codeTries++;
    Sound.play('denied');
    disp.classList.remove('shake'); void disp.offsetWidth; disp.classList.add('shake');
    const n = parseInt(code, 10), t = parseInt(target, 10);
    let text = '✗ WRONG CODE';
    if (state.codeTries >= 6) text += ` (${code} is too ${n < t ? 'low' : 'high'})`;
    msg.className = 'kp-msg bad';
    msg.textContent = text;
    if (state.codeTries >= 3 && DOOR_EXTRA_HINT) {
      const ex = el.keypad.querySelector('[data-kp-extra]');
      ex.textContent = DOOR_EXTRA_HINT;
      ex.hidden = false;
    }
    code = '';
    renderCode();
  }

  /* ---- camera ---- */
  function targetCam() {
    let focus = P.y + PH / 2;
    if (mode === 'cutscene') focus = (P.y + LEDGE_Y) / 2;
    const t = focus - viewH * 0.58;
    return Math.max(DOOR.y - 100, Math.min(FLOOR_Y + 70 - viewH, t));
  }

  /* ---- drawing ---- */
  function draw() {
    const c = ctx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#090B0A';
    c.fillRect(0, 0, cssW, cssH);
    const sx = shake > 0 && !REDUCED ? (Math.random() - 0.5) * 8 * shake : 0;
    const sy = shake > 0 && !REDUCED ? (Math.random() - 0.5) * 8 * shake : 0;
    c.save();
    c.translate(offX + sx, sy);
    c.scale(scale, scale);
    c.translate(0, -camY);
    const top = camY, bot = camY + viewH;
    drawOutside(c, top, bot);
    drawBackdrop(c, top, bot);
    drawDoor(c);
    for (const p of plats) if (p.y + p.h > top - 20 && p.y < bot + 20) drawPlat(c, p);
    for (const k of HAZARDS) if (k.y + k.h > top - 20 && k.y < bot + 20) drawBrick(c, k);
    if (B.alive || B.sinking) drawSprite(c, 'bunnyMini', B.x, B.y, B.face, B.alpha);
    if (B.sayT > 0 && B.say && B.alive) drawBubble(c, B.x + PW / 2, B.y - 6, B.say);
    if (mode !== 'off') drawSprite(c, playerFrame(), P.x, P.y, P.face, 1);
    drawLava(c, bot);
    for (const e of embers) { c.fillStyle = `rgba(255,${(150 + e.life * 50) | 0},70,${Math.min(1, e.life).toFixed(2)})`; c.fillRect(e.x, e.y, 2, 2); }
    drawWalls(c, top, bot);
    c.restore();
    // darkness around the edges, light around you
    const px = offX + (P.x + PW / 2) * scale, py = (P.y + PH / 2 - camY) * scale;
    const g = c.createRadialGradient(px, py, 40 * scale, px, py, Math.max(cssW, cssH) * 0.85);
    g.addColorStop(0, 'rgba(5,7,7,0)');
    g.addColorStop(1, 'rgba(5,7,7,0.8)');
    c.fillStyle = g;
    c.fillRect(0, 0, cssW, cssH);
  }
  function playerFrame() {
    if (!P.onGround) return 'reiJump';
    if (P.walkT > 0) return Math.floor(P.walkT * 9) % 2 ? 'reiWalk' : 'rei';
    return 'rei';
  }
  function drawSprite(c, name, x, y, face, alpha) {
    const img = pixelCanvas(name, face < 0);
    c.globalAlpha = alpha;
    c.drawImage(img, x - (img.width * 2 - PW) / 2, y + PH - img.height * 2, img.width * 2, img.height * 2);
    c.globalAlpha = 1;
  }
  function drawBubble(c, x, y, text) {
    c.font = 'bold 9px monospace';
    const w = c.measureText(text).width + 10;
    x = Math.max(WALL_L + w / 2 + 2, Math.min(WALL_R - w / 2 - 2, x));   // keep it inside the tower
    c.fillStyle = '#FFFAF0'; c.fillRect(x - w / 2, y - 16, w, 13);
    c.strokeStyle = '#0B0E0D'; c.lineWidth = 1.5; c.strokeRect(x - w / 2, y - 16, w, 13);
    c.fillStyle = '#A8401F'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(text, x, y - 9.5);
  }
  // the dim far wall on either side of the tower: hanging chains and old chalk drawings
  const DOODLES = [
    { x: -46, y: 1420, k: 'pair' }, { x: WORLD_W + 44, y: 1300, k: 'sun' }, { x: -40, y: 1120, k: 'eye' },
    { x: WORLD_W + 40, y: 960, k: 'house' }, { x: -44, y: 800, k: 'heart' }, { x: WORLD_W + 46, y: 640, k: 'pair' },
    { x: -42, y: 470, k: 'sun' }, { x: WORLD_W + 42, y: 330, k: 'eye' }, { x: -46, y: 190, k: 'heart' }
  ];
  function drawOutside(c, top, bot) {
    const ext = offX / scale + 2;
    if (ext < 6) return;
    c.fillStyle = '#0D100F';
    c.fillRect(-ext, top, ext, bot - top);
    c.fillRect(WORLD_W, top, ext, bot - top);
    c.strokeStyle = 'rgba(255,255,255,0.025)';
    c.lineWidth = 1;
    c.beginPath();
    for (let y = Math.floor(top / 16) * 16; y < bot; y += 16) {
      c.moveTo(-ext, y); c.lineTo(0, y); c.moveTo(WORLD_W, y); c.lineTo(WORLD_W + ext, y);
      const off = (Math.round(y / 16) % 2) ? 0 : 20;
      for (let x = -Math.ceil(ext / 40) * 40 + off; x < 0; x += 40) { c.moveTo(x, y); c.lineTo(x, y + 16); }
      for (let x = WORLD_W + off; x < WORLD_W + ext; x += 40) { c.moveTo(x, y); c.lineTo(x, y + 16); }
    }
    c.stroke();
    // chains
    c.strokeStyle = 'rgba(150,160,150,0.18)';
    c.lineWidth = 1.4;
    for (const cx of [-22, -88, -150, WORLD_W + 22, WORLD_W + 88, WORLD_W + 150]) {
      if (cx < -ext || cx > WORLD_W + ext) continue;
      const sway = REDUCED ? 0 : Math.sin(time * 0.8 + cx) * 1.2;
      for (let y = Math.floor(top / 10) * 10; y < bot; y += 10) {
        if ((y / 10) % 2) c.strokeRect(cx - 2 + sway, y, 4, 7); else { c.beginPath(); c.moveTo(cx + sway, y); c.lineTo(cx + sway, y + 9); c.stroke(); }
      }
    }
    // chalk doodles, like a child drew them a long time ago
    c.strokeStyle = 'rgba(255,240,205,0.13)';
    c.lineWidth = 1.3;
    c.lineCap = 'round';
    for (const d of DOODLES) {
      if (d.y < top - 40 || d.y > bot + 40 || d.x < -ext + 8 || d.x > WORLD_W + ext - 8) continue;
      c.beginPath();
      const { x, y } = d;
      if (d.k === 'pair') {
        [-8, 8].forEach((o, i) => {
          c.moveTo(x + o + 5, y - 20); c.arc(x + o, y - 20, 5, 0, Math.PI * 2);
          c.moveTo(x + o, y - 15); c.lineTo(x + o, y); c.moveTo(x + o, y); c.lineTo(x + o - 4, y + 9); c.moveTo(x + o, y); c.lineTo(x + o + 4, y + 9);
          if (i) { c.moveTo(x + o - 4, y - 25); c.lineTo(x + o - 3, y - 33); c.moveTo(x + o + 4, y - 25); c.lineTo(x + o + 3, y - 33); }
        });
        c.moveTo(x - 8, y - 9); c.lineTo(x + 8, y - 9);
      } else if (d.k === 'sun') {
        c.moveTo(x + 8, y); c.arc(x, y, 8, 0, Math.PI * 2);
        for (let a = 0; a < 8; a++) { const r = a * Math.PI / 4; c.moveTo(x + Math.cos(r) * 11, y + Math.sin(r) * 11); c.lineTo(x + Math.cos(r) * 16, y + Math.sin(r) * 16); }
      } else if (d.k === 'eye') {
        c.moveTo(x - 14, y); c.quadraticCurveTo(x, y - 11, x + 14, y); c.quadraticCurveTo(x, y + 11, x - 14, y);
        c.moveTo(x + 4, y); c.arc(x, y, 4, 0, Math.PI * 2);
      } else if (d.k === 'house') {
        c.rect(x - 10, y - 8, 20, 16); c.moveTo(x - 13, y - 8); c.lineTo(x, y - 20); c.lineTo(x + 13, y - 8); c.rect(x - 3, y, 6, 8);
      } else if (d.k === 'heart') {
        c.moveTo(x, y + 9); c.bezierCurveTo(x - 16, y - 2, x - 7, y - 14, x, y - 5); c.bezierCurveTo(x + 7, y - 14, x + 16, y - 2, x, y + 9);
      }
      c.stroke();
    }
    c.lineCap = 'butt';
  }
  function drawBackdrop(c, top, bot) {
    c.fillStyle = '#141816';
    c.fillRect(WALL_L, top, WALL_R - WALL_L, bot - top);
    c.strokeStyle = 'rgba(255,255,255,0.04)';
    c.lineWidth = 1;
    c.beginPath();
    for (let y = Math.floor(top / 16) * 16; y < bot; y += 16) {
      c.moveTo(WALL_L, y); c.lineTo(WALL_R, y);
      const off = (Math.round(y / 16) % 2) ? 0 : 20;
      for (let x = WALL_L + off; x < WALL_R; x += 40) { c.moveTo(x, y); c.lineTo(x, y + 16); }
    }
    c.stroke();
    if (!state.sacrificed && bot > SLAB_Y - 80 && top < LEDGE_Y + 20) {   // a faint light shines down through the narrow gap
      const sh = c.createLinearGradient(0, SLAB_Y - 70, 0, LEDGE_Y);
      sh.addColorStop(0, 'rgba(255,240,181,0)'); sh.addColorStop(0.45, 'rgba(255,240,181,0.12)'); sh.addColorStop(1, 'rgba(255,240,181,0)');
      c.fillStyle = sh; c.fillRect(GAP_X1 + 2, SLAB_Y - 70, GAP_X2 - GAP_X1 - 4, LEDGE_Y - SLAB_Y + 70);
    }
    if (top < DOOR.y + 260) {
      const cx = DOOR.x + DOOR.w / 2, cy = DOOR.y + DOOR.h / 2;
      const dg = c.createRadialGradient(cx, cy, 6, cx, cy, 170);
      dg.addColorStop(0, 'rgba(255,236,170,0.55)');
      dg.addColorStop(1, 'rgba(255,236,170,0)');
      c.fillStyle = dg;
      c.fillRect(WALL_L, cy - 170, WALL_R - WALL_L, 340);
    }
  }
  function drawWalls(c, top, bot) {
    c.fillStyle = '#1E2422';
    c.fillRect(0, top, WALL_L, bot - top);
    c.fillRect(WALL_R, top, WORLD_W - WALL_R, bot - top);
    c.fillStyle = '#34403C';
    c.fillRect(WALL_L - 2, top, 2, bot - top);
    c.fillRect(WALL_R, top, 2, bot - top);
  }
  function drawPlat(c, p) {
    let fill, hi;
    if (p.kind === 'floor') { fill = '#2A302D'; hi = '#3B4440'; }
    else if (p.kind === 'slab') { fill = p.sealed ? '#4A4540' : '#3A403D'; hi = '#5A635E'; }
    else if (p.kind === 'ledge') { fill = '#5A4E46'; hi = '#7A6D62'; }
    else if (p.kind === 'top') { fill = '#BFA54C'; hi = '#F4D76A'; }
    else { const ci = (p.c != null ? p.c : p.i) % 3; fill = BLOCK_COLORS[ci][0]; hi = BLOCK_COLORS[ci][1]; }
    c.globalAlpha = p.falling ? Math.max(0, 1 - (p.y - p.by) / 70) : 1;
    let jig = 0;
    if (p.kind === 'crumble' && p.crumbleT > 0 && !p.falling && !REDUCED) jig = Math.sin(time * 70) * 1.2;
    p = jig ? Object.assign({}, p, { x: p.x + jig }) : p;
    c.fillStyle = '#0B0E0D'; c.fillRect(p.x - 1.5, p.y - 1.5, p.w + 3, p.h + 3);
    c.fillStyle = fill; c.fillRect(p.x, p.y, p.w, p.h);
    c.fillStyle = hi; c.fillRect(p.x, p.y, p.w, 2);
    c.fillStyle = 'rgba(0,0,0,0.28)'; c.fillRect(p.x, p.y + p.h - 2.5, p.w, 2.5);
    if (p.move) {
      c.fillStyle = 'rgba(11,14,13,0.55)';
      c.beginPath(); c.moveTo(p.x + 4, p.y + 5); c.lineTo(p.x + 9, p.y + 2.5); c.lineTo(p.x + 9, p.y + 7.5); c.fill();
      c.beginPath(); c.moveTo(p.x + p.w - 4, p.y + 5); c.lineTo(p.x + p.w - 9, p.y + 2.5); c.lineTo(p.x + p.w - 9, p.y + 7.5); c.fill();
    }
    if (p.kind === 'crumble') {
      c.strokeStyle = 'rgba(11,14,13,0.6)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(p.x + p.w * 0.3, p.y); c.lineTo(p.x + p.w * 0.42, p.y + 5); c.lineTo(p.x + p.w * 0.36, p.y + p.h);
      c.moveTo(p.x + p.w * 0.7, p.y); c.lineTo(p.x + p.w * 0.62, p.y + 6); c.stroke();
    }
    if (p.kind === 'flag') {
      const lit = !!checkpoint, lx = p.x + p.w - 9;
      c.fillStyle = '#0B0E0D'; c.fillRect(lx - 0.5, p.y - 17, 2.5, 17);
      if (lit) { const g = c.createRadialGradient(lx + 1, p.y - 19, 1, lx + 1, p.y - 19, 22); g.addColorStop(0, 'rgba(244,215,106,0.55)'); g.addColorStop(1, 'rgba(244,215,106,0)'); c.fillStyle = g; c.fillRect(lx - 21, p.y - 41, 44, 44); }
      c.fillStyle = '#0B0E0D'; c.fillRect(lx - 3.5, p.y - 24, 9, 9);
      c.fillStyle = lit ? '#F4D76A' : '#4A524E'; c.fillRect(lx - 2, p.y - 22.5, 6, 6);
    }
    if (p.kind === 'slab' && !p.sealed) {
      // jagged, broken edges right at the gap
      const ex = p.x + p.w === GAP_X1 ? p.x + p.w : p.x, dir = p.x + p.w === GAP_X1 ? -1 : 1;
      c.fillStyle = '#0B0E0D';
      c.beginPath(); c.moveTo(ex, p.y); c.lineTo(ex + dir * 4, p.y + 5); c.lineTo(ex, p.y + 9); c.lineTo(ex + dir * 3, p.y + 14); c.lineTo(ex, p.y + p.h); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(p.x + p.w * 0.3, p.y + 3); c.lineTo(p.x + p.w * 0.36, p.y + 9); c.lineTo(p.x + p.w * 0.32, p.y + 14); c.stroke();
    }
    c.globalAlpha = 1;
  }
  function drawBrick(c, k) {
    const glow = REDUCED ? 0.35 : 0.3 + 0.12 * Math.sin(time * 3);
    c.fillStyle = `rgba(210,85,106,${glow.toFixed(2)})`; c.fillRect(k.x - 3, k.y - 3, k.w + 6, k.h + 3);
    c.fillStyle = '#0B0E0D'; c.fillRect(k.x - 1, k.y - 1, k.w + 2, k.h + 1);
    c.fillStyle = '#D2556A'; c.fillRect(k.x, k.y, k.w, k.h);
    c.fillStyle = '#F2A7C6'; c.fillRect(k.x, k.y, k.w, 1.5);
  }
  function drawDoor(c) {
    const d = DOOR, cx = d.x + d.w / 2;
    c.save();
    c.globalAlpha = 0.18 + 0.08 * Math.sin(time * 2) + doorOpenT * 0.3;
    c.fillStyle = '#FFF0B5';
    for (let i = -2; i <= 2; i++) {
      c.beginPath(); c.moveTo(cx, d.y + 8); c.lineTo(cx + i * 32 - 10, d.y - 80); c.lineTo(cx + i * 32 + 10, d.y - 80); c.closePath(); c.fill();
    }
    c.restore();
    c.fillStyle = '#0B0E0D'; c.fillRect(d.x - 4, d.y - 4, d.w + 8, d.h + 4);
    c.fillStyle = '#FFF8DE'; c.fillRect(d.x, d.y, d.w, d.h);
    const pw = d.w * (1 - doorOpenT * 0.85);
    c.fillStyle = '#C9A83F'; c.fillRect(d.x, d.y, pw, d.h);
    if (pw > 10) {
      c.fillStyle = '#A8892F';
      c.fillRect(d.x + 3, d.y + 4, pw / 2 - 4, 16); c.fillRect(d.x + pw / 2 + 1, d.y + 4, pw / 2 - 4, 16);
      c.fillRect(d.x + 3, d.y + 24, pw / 2 - 4, 20); c.fillRect(d.x + pw / 2 + 1, d.y + 24, pw / 2 - 4, 20);
      c.fillStyle = '#F4D76A'; c.fillRect(d.x + pw - 6, d.y + 22, 3, 3);
    }
  }
  function drawLava(c, bot) {
    if (lava.y > bot + 40) return;
    const ly = lava.y;
    const glow = c.createLinearGradient(0, ly - 80, 0, ly);
    glow.addColorStop(0, 'rgba(255,120,50,0)');
    glow.addColorStop(1, 'rgba(255,120,50,0.38)');
    c.fillStyle = glow;
    c.fillRect(0, ly - 80, WORLD_W, 80);
    const body = c.createLinearGradient(0, ly, 0, ly + 140);
    body.addColorStop(0, '#FFB347'); body.addColorStop(0.25, '#E2531F'); body.addColorStop(1, '#4A1406');
    c.fillStyle = body;
    c.beginPath();
    c.moveTo(0, ly);
    for (let x = 0; x <= WORLD_W; x += 6) c.lineTo(x, ly + Math.sin(x * 0.09 + time * 3) * 2.5 + Math.sin(x * 0.23 - time * 2) * 1.2);
    c.lineTo(WORLD_W, bot + 60); c.lineTo(0, bot + 60); c.closePath(); c.fill();
    c.strokeStyle = '#FFE08A'; c.lineWidth = 1.5;
    c.beginPath();
    for (let x = 0; x <= WORLD_W; x += 6) { const yy = ly + Math.sin(x * 0.09 + time * 3) * 2.5 + Math.sin(x * 0.23 - time * 2) * 1.2; if (x === 0) c.moveTo(x, yy); else c.lineTo(x, yy); }
    c.stroke();
  }

  return {
    start, engulf, sealGap, press, retry,
    get info() { return P ? { mode, x: Math.round(P.x), y: Math.round(P.y), feet: Math.round(P.y + PH), lavaY: Math.round(lava.y), lavaActive: lava.active, deaths, bunnyAlive: B.alive, onGround: P.onGround } : null; },
    warp(x, y) { if (!P) return; P.x = x; P.y = y; P.vy = 0; P.onGround = false; },
    level: LEVEL, consts: { PW, PH, JUMP_V, GRAV, SPEED, WALL_L, WALL_R }
  };
})();

      spawnFloaters(scene.querySelector('[data-fx]'), { count: 10, kinds: ['sparkle'], mode: 'up', min: 3, max: 6, opacity: 0.3 });
      Dialogue.mount(scene.querySelector('[data-dlg]'));
      scene.querySelector('.stage').addEventListener('click', () => Dialogue.advance());
      later(() => Dialogue.play(SCRIPT.backrooms(), () => { state.backroomsDone = true; goTo('obby', 'darkfade'); }), 250);
    }
  },

  /* ---------- 8. THE TOWER (parkour + lava) ---------- */
  obby: {
    build() {
      const key = (d, label, cls = '') => `<button type="button" class="${cls}" data-d="${d}" aria-label="${label}">${label === 'Delete' ? '⌫' : label === 'Enter code' ? '✓' : d}</button>`;
      return h(`<section class="scene scene-obby ln" aria-label="The tower">
          <div class="obby-wrap"><canvas role="img" aria-label="A tall tower of floating blocks with lava below and a glowing door at the top."></canvas>
            <button type="button" class="open-btn" data-open hidden>OPEN ▲</button></div>
          <div class="obby-hud">
            <p class="obby-tip" data-tip hidden>↑ Climb to the glowing door at the top!</p>
            <p class="lava-alert" data-lava hidden>⚠ THE LAVA IS RISING! ⚠</p>
          </div>
          <div class="ov obby-dead" data-dead hidden><div class="panel" role="alertdialog" aria-labelledby="deadTitle">
            <p class="dead-title" id="deadTitle">THE LAVA CAUGHT YOU!</p>
            <p class="dead-sub" data-dead-sub></p>
            <button type="button" class="btn big pink" data-retry>TRY AGAIN</button>
          </div></div>
          <div class="ov keypad" data-keypad hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="kpTitle">
            <div class="kp-lock" aria-hidden="true">${pixelSVG('lock')}</div>
            <h2 class="kp-title" id="kpTitle">THE DOOR IS LOCKED</h2>
            <p class="kp-hint">Enter the 2-digit code.<br><b>Hint:</b> ${escapeHTML(DOOR_HINT)}</p>
            <p class="kp-extra" data-kp-extra hidden></p>
            <div class="kp-display" data-kp-display aria-live="polite"><span>_</span><span>_</span></div>
            <div class="kp-keys">
              ${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => key(d, d)).join('')}
              ${key('del', 'Delete', 'kp-del')}${key('0', '0')}${key('ok', 'Enter code', 'kp-ok')}
            </div>
            <p class="kp-msg" data-kp-msg aria-live="assertive"></p>
          </div></div>
          <div class="grain" aria-hidden="true"></div>
          <div class="bottom">
            <div data-dlg></div>
            <div class="pad" data-pad hidden>
              <div class="pad-move">
                <button type="button" data-k="left" aria-label="Move left">◀</button>
                <button type="button" data-k="right" aria-label="Move right">▶</button>
              </div>
              <button type="button" class="pad-jump" data-k="jump" aria-label="Jump">JUMP ▲</button>
            </div>
            <p class="pad-hint" data-padhint hidden>Keyboard: ← → to move · Space or ↑ to jump</p>
          </div>
        </section>`);
    },
    enter(scene) { Obby.start(scene); }
  },

  /* ---------- 9. REMEMBERING EVERYTHING ---------- */
  recollect: {
    build() {
      return h(`<section class="scene scene-vn scene-recollect" aria-label="Remembering">
          <div class="bg rec-bg"></div>
          <div class="fx" data-fx></div>
          <div class="stage"><div class="polaroids" data-polaroid></div></div>
          <div class="grain" aria-hidden="true"></div>
          <div class="bottom"><div data-dlg></div></div>
        </section>`);
    },
    enter(scene) {
      polaroidCount = 0;
      spawnFloaters(scene.querySelector('[data-fx]'), { count: 14, kinds: ['sparkle', 'star'], mode: 'up', min: 6, max: 12, opacity: 0.5 });
      Dialogue.mount(scene.querySelector('[data-dlg]'));
      scene.querySelector('.stage').addEventListener('click', () => Dialogue.advance());
      later(() => Dialogue.play(SCRIPT.recollect(), () => { state.recollected = true; goTo('finale', 'light'); }), 300);
    }
  },

  /* ---------- 10. BEHIND THE REAL LAST DOOR ---------- */
  finale: {
    build() {
      return h(`<section class="scene scene-vn scene-finale" aria-label="Behind the last door">
          <div class="bg">${BG.secret(true)}</div>
          <div class="tint soft"></div>
          <div class="fx" data-fx></div>
          <div class="stage pan" data-pan><div class="sprite is-hidden" data-sprite="bunny"><div class="anim"></div></div></div>
          <div class="letter-layer" data-letter hidden></div>
          <div class="bottom"><div data-dlg></div></div>
        </section>`);
    },
    enter(scene) {
      setupSprite(scene, 'bunny', bunnySVG, 'happy', {}, 'bob');
      spawnFloaters(scene.querySelector('[data-fx]'), { count: 16, kinds: ['sparkle', 'heart', 'star'], mode: 'up', min: 10, max: 20, opacity: 0.8 });
      Dialogue.mount(scene.querySelector('[data-dlg]'));
      scene.querySelector('.stage').addEventListener('click', () => Dialogue.advance());
      later(() => Dialogue.play(SCRIPT.finale(), () => showLetter(scene)), 400);
    }
  }
};


/* =============================================================
   13. FLOW, TRANSITIONS & RESTART
   ============================================================= */
const WIPE_COLS = 10, WIPE_ROWS = 8, WIPE_STEP = 18;

function buildWipe() {
  let html = '';
  for (let r = 0; r < WIPE_ROWS; r++) {
    for (let c = 0; c < WIPE_COLS; c++) html += `<i style="--d:${(c + r) * WIPE_STEP}ms"></i>`;
  }
  wipeEl.innerHTML = html;
}

// Scenes can only be entered in story order, so nothing can be skipped.
function canEnter(name) {
  switch (name) {
    case 'haunting':   return state.clues.size === CLUES.length;
    case 'trial':      return state.hauntingSeen;
    case 'lastDoor':   return state.trialComplete;
    case 'fall':       return state.trapSprung;
    case 'ballPit':    return state.fallen;
    case 'backrooms':  return state.landed;
    case 'obby':       return state.backroomsDone;
    case 'recollect':  return state.codeOK;
    case 'finale':     return state.recollected;
    default:           return true;
  }
}

function transition(style, swap) {
  return new Promise(resolve => {
    if (style === 'none') { swap(); resolve(); return; }
    if (style === 'fade' || style === 'darkfade' || style === 'light' || REDUCED) {
      const tint = style === 'darkfade' ? ' dark' : style === 'light' ? ' light' : '';
      const ms = REDUCED ? 330 : style === 'darkfade' ? 650 : style === 'light' ? 450 : 330;
      wipeEl.className = 'fade active' + tint;
      void wipeEl.offsetWidth;
      wipeEl.classList.add('on');
      setTimeout(() => {
        swap();
        wipeEl.classList.remove('on');
        setTimeout(() => { wipeEl.className = ''; resolve(); }, ms);
      }, ms);
      return;
    }
    const total = (WIPE_COLS + WIPE_ROWS - 2) * WIPE_STEP + 220;
    wipeEl.className = style + ' cover active';
    setTimeout(() => {
      swap();
      wipeEl.className = style + ' reveal active';
      setTimeout(() => { wipeEl.className = ''; resolve(); }, total);
    }, total);
  });
}

function goTo(name, style = 'pixel') {
  if (state.busy) return false;
  if (!SCENES[name] || !canEnter(name)) return false;
  state.busy = true;
  if (style !== 'none') Sound.play('whoosh');
  transition(style, () => {
    clearTimers();
    Dialogue.stop();
    Object.keys(sprites).forEach(k => delete sprites[k]);
    sceneCleanup.splice(0).forEach(fn => fn());
    root.querySelectorAll('.scene, .fly, .burst, .glitch-bars').forEach(n => n.remove());
    state.scene = name;
    state.dialogueIndex = 0;
    const def = SCENES[name];
    const el = def.build();
    root.insertBefore(el, wipeEl);
    root.dataset.scene = name;
    current = el;
    Sound.music(SCENE_MUSIC[name]);
    def.enter(el);
  }).then(() => {
    state.busy = false;
    focusDefault();
  });
  return true;
}

function focusDefault() {
  if (!current || !keyboardMode) return;
  const t = current.querySelector('[data-autofocus]:not([disabled])');
  if (t) { t.focus({ preventScroll: true }); return; }
  const nb = Dialogue.nextBtn;
  if (Dialogue.canAdvance() && nb && nb.isConnected) nb.focus({ preventScroll: true });
}

// PLAY AGAIN: wipe every variable and return to the title screen.
function restart() {
  if (state.busy) return;
  state = freshState();
  pokeCount = 0;
  Sound.play('start');
  goTo('title', 'pixel');
}


/* =============================================================
   14. INPUT & BOOT
   ============================================================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ' || e.key.indexOf('Arrow') === 0) keyboardMode = true;
}, true);
document.addEventListener('pointerdown', () => { keyboardMode = false; }, true);

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target;
  if (t && t.closest && t.closest('button, a, input, textarea, select, [role="button"]')) return;
  if (Dialogue.canAdvance()) { e.preventDefault(); Dialogue.advance(); }
});

(function boot() {
  buildWipe();
  const icon = document.querySelector('link[rel="icon"]');
  if (icon) icon.href = 'data:image/svg+xml,' + encodeURIComponent(pixelSVG('door'));
  document.title = `${TITLE_MAIN} ${TITLE_SUB}`;
  root.setAttribute('aria-label', document.title);
  setupSoundButton();
  goTo('title', 'none');
})();
</script>
