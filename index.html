<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4FAFAD">
<meta name="description" content="Torei: Behind the Last Door, a tiny point-and-click mystery.">
<title>Torei: Behind the Last Door</title>
<link rel="icon" href="data:,">
<style>
/* =============================================================
   TOREI: BEHIND THE LAST DOOR: STYLES
   TEAL = interface · PINK = affection · YELLOW = clues · CREAM = base
   ============================================================= */
:root{
  --teal:#4FAFAD; --teal-d:#286F70; --teal-l:#BFE5DF;
  --pink:#F2A7C6; --pink-d:#C96C97; --pink-l:#F8D6E5;
  --yellow:#F4D76A; --yellow-d:#C9A83F; --yellow-l:#FFF0B5;
  --cream:#FFF5E5; --cream-d:#E9D9BE; --cream-l:#FFFAF0;
  --ink:#263B3A; --text:#3A3936; --white:#FFFDF7;
  --mono: ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono","Courier New",monospace;
  --type: "American Typewriter","Courier Prime","Courier New",Courier,ui-monospace,"Roboto Mono",monospace;
  --round: ui-rounded,"Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Nunito","Varela Round","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* chunky pixel outline with notched corners */
  --pxb: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink);
  --pxb3: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  min-height:100vh; min-height:100dvh;
  display:grid; place-items:center; overflow:hidden;
  font-family:var(--round); color:var(--text);
  background-color:var(--teal-l);
  background-image:
    linear-gradient(45deg, rgba(255,250,240,.6) 25%, transparent 25%, transparent 75%, rgba(255,250,240,.6) 75%),
    linear-gradient(45deg, rgba(255,250,240,.6) 25%, transparent 25%, transparent 75%, rgba(255,250,240,.6) 75%);
  background-size:36px 36px; background-position:0 0, 18px 18px;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}

/* ---------- Game window ---------- */
#game{
  position:relative;
  container:game / size;
  width:min(calc(100vw - 56px), 1000px);
  height:min(calc(100vh - 56px), 720px);
  height:min(calc(100dvh - 56px), 720px);
  background:var(--cream);
  overflow:hidden; isolation:isolate;
  user-select:none; -webkit-user-select:none;
  touch-action:manipulation;
  image-rendering:pixelated;
  box-shadow:
    0 0 0 4px var(--ink), 0 0 0 10px var(--teal), 0 0 0 14px var(--ink),
    16px 18px 0 14px rgba(38,59,58,.22);
}
@media (max-width:700px), (max-height:600px){
  #game{ width:100vw; height:100vh; height:100dvh; box-shadow:none; }
}
[hidden]{ display:none!important; }
.sr-only{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.noscript{ font:700 18px/1.4 var(--mono); color:var(--ink); background:var(--cream-l); padding:20px; }
svg.px{ display:block; shape-rendering:crispEdges; }

/* ---------- Scenes ---------- */
.scene{ position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden; animation:sceneIn .35s ease both; }
.bg{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.bg > svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.fx{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
.top{ position:relative; z-index:3; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 10px; padding:14px 64px 2px 16px; }
.stage{ position:relative; z-index:1; flex:1 1 auto; min-height:0; }
.bottom{ position:relative; z-index:4; padding:0 14px 14px; padding-bottom:max(14px, env(safe-area-inset-bottom)); }
.is-hidden{ visibility:hidden; opacity:0; }

.tag{
  display:inline-flex; align-items:center; gap:6px; margin:4px;
  font:800 12px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
  padding:8px 11px 7px; background:var(--teal-d); color:var(--cream-l);
  box-shadow:var(--pxb);
}

/* ---------- Pixel buttons ---------- */
.btn{
  -webkit-appearance:none; appearance:none; border:0; margin:4px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  font:800 17px/1.1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
  color:var(--cream-l); background:var(--teal-d);
  padding:14px 22px; min-height:52px; min-width:52px;
  box-shadow:var(--pxb), inset 0 -5px 0 0 rgba(38,59,58,.45), inset 0 4px 0 0 rgba(191,229,223,.35);
  position:relative; touch-action:manipulation;
  transition:transform .08s steps(2), background-color .15s;
}
.btn:hover{ background:#2F8081; transform:translateY(-2px); }
.btn:active{ transform:translateY(2px); box-shadow:var(--pxb), inset 0 -2px 0 0 rgba(38,59,58,.45), inset 0 2px 0 0 rgba(191,229,223,.25); }
.btn.pink{ background:var(--pink); color:var(--ink); box-shadow:var(--pxb), inset 0 -5px 0 0 rgba(201,108,151,.55), inset 0 4px 0 0 rgba(255,253,247,.5); }
.btn.pink:hover{ background:#F6B9D2; }
.btn.yellow{ background:var(--yellow); color:var(--ink); box-shadow:var(--pxb), inset 0 -5px 0 0 rgba(201,168,63,.7), inset 0 4px 0 0 rgba(255,253,247,.5); }
.btn.yellow:hover{ background:#F7DF85; }
.btn.cream{ background:var(--cream-l); color:var(--ink); box-shadow:var(--pxb), inset 0 -5px 0 0 var(--cream-d), inset 0 0 0 4px var(--teal-l); }
.btn.cream:hover{ background:#FFFFFF; }
.btn.big{ font-size:clamp(18px, 2.4vw, 23px); padding:16px 30px; min-height:60px; }
.btn:disabled, .btn:disabled:hover{
  cursor:not-allowed; background:var(--cream-d); color:#5E5A52; transform:none;
  box-shadow:var(--pxb), inset 0 -4px 0 0 rgba(38,59,58,.12);
}
.btn-ico{ display:inline-block; width:18px; flex:none; }
.btn-ico svg{ width:100%; height:auto; }
:focus{ outline:none; }
:focus-visible{ outline:3px dashed var(--pink-d); outline-offset:6px; }
.scene-trial :focus-visible{ outline-color:var(--yellow); }

/* ---------- Dialogue box ---------- */
.dlg{
  position:relative; display:flex; gap:14px; align-items:flex-start;
  margin:24px 4px 4px; padding:16px 16px 34px 14px; min-height:122px;
  background:var(--cream-l); color:var(--text); cursor:pointer;
  box-shadow:var(--pxb), inset 0 0 0 4px var(--teal-l), 8px 8px 0 4px rgba(38,59,58,.2);
}
.dlg.static{ cursor:default; }
.dlg-name{
  position:absolute; left:14px; top:-24px; z-index:2; margin:4px;
  padding:7px 12px 6px; font:900 14px/1 var(--mono); letter-spacing:.16em;
  background:var(--teal-d); color:var(--cream-l); box-shadow:var(--pxb);
}
.dlg-name:empty, .dlg-name span:empty{ display:none; }
.tag-pink{ background:var(--pink); color:var(--ink); }
.tag-yellow{ background:var(--yellow); color:var(--ink); }
.tag-teal{ background:var(--teal-d); color:var(--cream-l); }
.tag-mint{ background:var(--teal-l); color:var(--ink); }
.dlg-name.flip{ animation:flip .5s steps(6); }
.dlg-name.revealed{ background:var(--pink); color:var(--ink); box-shadow:var(--pxb), 0 0 0 9px rgba(242,167,198,.45); }
.dlg-portrait{
  flex:none; width:clamp(56px, 9cqw, 84px); aspect-ratio:1/1; margin:3px;
  background:var(--teal-l); box-shadow:0 0 0 3px var(--ink), inset 0 -6px 0 0 rgba(79,175,173,.25);
  overflow:hidden; display:grid; place-items:center;
}
.dlg-portrait svg{ width:100%; height:100%; display:block; }
.dlg-portrait.you{ background:var(--yellow-l); }
.dlg-portrait.you svg{ width:70%; height:70%; }
.dlg-text{
  flex:1; margin:2px 0 0; min-height:3em;
  font:700 clamp(15.5px, 1.2cqw + 8.5px, 20px)/1.5 var(--type); color:var(--text); letter-spacing:.01em;
}
.caret{
  display:inline-block; width:.55em; height:1.05em; margin-left:3px; vertical-align:-.18em;
  background:var(--teal); animation:caret 1.05s steps(2) infinite;
}
.dlg.typing .caret{ animation:none; }
.dlg.static:not(.typing) .caret{ opacity:.35; animation:none; }
.dlg-next{
  position:absolute; right:10px; bottom:7px; border:0; cursor:pointer;
  background:var(--teal-d); color:var(--cream-l); padding:7px 10px; min-height:32px;
  font:900 12px/1 var(--mono); letter-spacing:.14em; box-shadow:0 0 0 3px var(--ink);
}
.dlg-next .tri{ display:inline-block; animation:nudge 1s steps(2) infinite; }
.dlg.static .dlg-next{ display:none; }
.dlg.narration{ padding-left:18px; }
.dlg.narration .dlg-portrait, .dlg.narration .dlg-name{ display:none; }
.dlg.narration .dlg-text{ text-align:center; font-style:italic; color:var(--teal-d); align-self:center; }
.dlg.narration .caret{ background:var(--pink); }

/* ---------- Sprites ---------- */
.sprite{
  position:absolute; left:0; right:0; margin:0 auto; bottom:-34px;
  width:min(90%, 430px); height:93%; pointer-events:none;
}
.anim{ width:100%; height:100%; transform-origin:50% 100%; }
.anim > svg{ width:100%; height:100%; display:block; overflow:visible; }
.anim.bob{ animation:bob 2.8s ease-in-out infinite; }
.anim.float{ animation:ghostFloat 3.4s ease-in-out infinite; }
.anim.hop{ animation:hop .5s ease-out; }
.anim.jump{ animation:jump .6s ease-out 2; }
.anim.breath{ animation:breath 1.6s ease-in-out; }
.anim.giggle{ animation:giggle .6s ease-in-out; }
.anim.twirl{ animation:twirl .9s ease-in-out; }
.anim.shiver{ animation:shiver .2s linear 4; }
.sprite.exit-left{ animation:exitLeft .7s steps(8) forwards; }
.sprite.poof{ animation:poof .5s steps(5) both; }
.ear-r{ transform-box:fill-box; transform-origin:30% 95%; animation:ear 5s ease-in-out infinite; }
.orb{ animation:orb 3.2s ease-in-out infinite; }
.orb.o2{ animation-delay:-1.6s; }
.flame{ transform-box:fill-box; transform-origin:50% 100%; animation:flame 1.8s ease-in-out infinite; }
.wave-arm{ transform-box:view-box; transform-origin:134px 188px; animation:wave 1.1s ease-in-out infinite; }
.bulb{ animation:bulb 2.6s ease-in-out infinite; animation-delay:calc(var(--i) * -.35s); }

/* ---------- Particles ---------- */
.floater{ position:absolute; left:var(--x); width:var(--s); opacity:var(--o, .9); pointer-events:none; }
.floater svg{ width:100%; height:auto; }
.floater.up{ bottom:-40px; animation:fUp var(--d) linear var(--dl) infinite; }
.floater.fall{ top:-40px; animation:fFall var(--d) linear var(--dl) infinite; }
.floater.tw{ top:var(--y); animation:fTw calc(var(--d) / 3) ease-in-out var(--dl) infinite; }
.floater.still{ top:var(--y); }
.deco{ position:absolute; pointer-events:none; }
.deco svg{ width:100%; height:auto; }
.deco.bob{ animation:bob 3.2s ease-in-out infinite; animation-delay:calc(var(--i) * -.45s); }
.deco.tw{ animation:fTw 3s ease-in-out infinite; animation-delay:calc(var(--i) * -.5s); }
.deco.drift{ animation:drift 16s ease-in-out infinite alternate; }
.burst{ position:absolute; z-index:45; width:18px; margin:-9px 0 0 -9px; pointer-events:none; animation:burst .75s cubic-bezier(.2,.7,.3,1) forwards; }
.burst svg{ width:100%; height:auto; }
.fly{ position:absolute; z-index:46; pointer-events:none; transform-origin:0 0; transition:transform .55s cubic-bezier(.5,-.25,.6,1), opacity .55s; }
.fly svg{ width:100%; height:100%; }

/* ---------- Sound toggle ---------- */
.snd{
  position:absolute; top:12px; right:12px; z-index:90; width:42px; height:42px; padding:7px; margin:0; border:0; cursor:pointer;
  background:var(--teal-d); color:var(--cream-l); box-shadow:var(--pxb3), inset 0 -4px 0 0 rgba(38,59,58,.45);
  touch-action:manipulation; transition:transform .08s steps(2);
}
.snd:hover{ transform:translateY(-2px); }
.snd:active{ transform:translateY(1px); }
.snd svg{ width:100%; height:100%; display:block; }
.snd[aria-pressed="false"]{ background:var(--cream-d); color:var(--ink); }
#game[data-scene="happyEnding"] .snd, #game[data-scene="honestEnding"] .snd{ top:26px; right:26px; }

/* ---------- Pixel wipe transition ---------- */
#wipe{ position:absolute; inset:0; z-index:100; display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(8,1fr); pointer-events:none; }
#wipe.active{ pointer-events:auto; }
#wipe i{ display:block; background:var(--wc, var(--teal)); transform:scale(0); }
#wipe.dark{ --wc:var(--teal-d); }
#wipe.pink{ --wc:var(--pink); }
#wipe.cover i{ animation:cellIn .2s steps(4) var(--d) both; }
#wipe.reveal i{ animation:cellOut .2s steps(4) var(--d) both; }
#wipe.fade{ background:var(--cream-l); opacity:0; transition:opacity .3s ease; }
#wipe.fade.on{ opacity:1; }
#wipe.fade.dark{ background:#16302F; transition-duration:.65s; }
#wipe.fade.light{ background:#FFF7DF; transition-duration:.45s; }
#wipe.fade i{ visibility:hidden; }

/* ---------- TITLE ---------- */
.scene-title .bg{
  background-color:var(--cream);
  background-image:radial-gradient(var(--cream-d) 1.6px, transparent 1.9px);
  background-size:22px 22px;
}
.scene-title .bg > svg{ top:auto; height:24%; }
.title-wrap{
  position:relative; z-index:3; flex:1; min-height:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(4px, 1.5cqh, 14px); padding:16px 16px 7%; text-align:center;
}
.chip{ margin:0; font:800 12px/1 var(--mono); letter-spacing:.24em; background:var(--teal-d); color:var(--cream-l); padding:8px 12px 7px; box-shadow:var(--pxb); }
.logo{ margin:0; display:flex; flex-direction:column; align-items:center; gap:clamp(2px, 1cqh, 10px); font-family:var(--mono); line-height:1; }
.logo .l1{ font-size:18px; font-size:clamp(13px, min(3cqw, 3.4cqh), 24px); font-weight:900; letter-spacing:.3em; color:var(--teal-d); }
.logo .big{
  display:inline-flex; align-items:center; gap:.12em;
  font-size:48px; font-size:clamp(32px, min(12.5cqw, 10.5cqh), 92px); font-weight:900; letter-spacing:.03em; color:var(--pink);
  text-shadow:
    4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 4px 0 var(--ink), 0 -4px 0 var(--ink),
    4px 4px 0 var(--ink), -4px 4px 0 var(--ink), 4px -4px 0 var(--ink), -4px -4px 0 var(--ink),
    8px 9px 0 var(--teal);
}
.logo .big.main{ font-size:56px; font-size:clamp(40px, min(17cqw, 14cqh), 124px); letter-spacing:.06em; }
.logo .sub{
  display:inline-flex; align-items:center; gap:.45em; margin:6px 4px 4px;
  font-size:20px; font-size:clamp(15px, min(5cqw, 4.6cqh), 36px); font-weight:900; letter-spacing:.08em;
  color:var(--cream-l); background:var(--teal-d); padding:.4em .7em .35em;
  box-shadow:var(--pxb), 6px 6px 0 4px rgba(242,167,198,.55);
}
.logo-door{ display:inline-block; width:1.05em; animation:bob 2.4s ease-in-out infinite; }
.logo-door svg{ width:100%; height:auto; }
.subtitle{ margin:0; font:700 16px/1.3 var(--mono); font-size:clamp(14px, min(2.4cqw, 3cqh), 20px); color:var(--teal-d); letter-spacing:.06em; }
.title-bunny{ height:22vh; height:clamp(64px, 25cqh, 230px); aspect-ratio:200/280; }
.hint{ margin:0; font:700 12px/1.2 var(--mono); color:var(--teal-d); letter-spacing:.08em; background:var(--cream-l); padding:5px 9px; box-shadow:0 0 0 2px var(--teal-l); }

/* ---------- INTRO / VN scenes ---------- */
.scene-intro .sprite.principal{ width:min(80%, 380px); }

/* ---------- INVESTIGATION ---------- */
.scene-inv .bg{ background:repeating-linear-gradient(90deg, var(--cream) 0 26px, var(--cream-l) 26px 52px); }
.counter{
  display:inline-flex; align-items:center; gap:8px; margin:4px;
  font:900 15px/1 var(--mono); letter-spacing:.06em; color:var(--ink);
  background:var(--yellow); padding:8px 12px 7px; box-shadow:var(--pxb);
}
.counter .ico{ width:18px; display:inline-block; }
.counter .ico svg{ width:100%; height:auto; }
.counter.bump{ animation:pop .4s steps(4); }
.counter.done{ background:var(--pink); }
.slots{ list-style:none; margin:0; padding:6px 14px 2px; display:flex; justify-content:center; gap:clamp(6px, 1.4cqw, 12px); position:relative; z-index:3; }
.slot{
  position:relative; margin:4px; width:clamp(36px, 6cqw, 50px); aspect-ratio:1/1;
  display:grid; place-items:center; background:var(--cream-l);
  box-shadow:var(--pxb3), inset 0 0 0 3px var(--cream-d);
}
.slot-q{ font:900 18px/1 var(--mono); color:#8F826A; }
.slot svg{ width:76%; height:76%; }
.slot.filled{ background:var(--yellow-l); box-shadow:var(--pxb3), inset 0 0 0 3px var(--yellow); animation:pop .4s steps(4); }
.slot.filled::after{
  content:"✓"; position:absolute; right:-7px; bottom:-7px; width:18px; height:18px;
  background:var(--teal-d); color:var(--cream-l); font:900 12px/18px var(--mono); text-align:center;
  box-shadow:0 0 0 2px var(--ink);
}
.inv-stage{ container-type:size; display:grid; place-items:center; }
.room{
  position:relative; aspect-ratio:4/3;
  width:min(calc(100cqw - 28px), calc((100cqh - 24px) * 4 / 3));
  background:var(--cream);
  box-shadow:0 0 0 4px var(--ink), 0 0 0 9px var(--teal), 0 0 0 12px var(--ink), 10px 10px 0 10px rgba(38,59,58,.16);
}
.room > svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.clue{
  position:absolute; width:12%; aspect-ratio:1/1; padding:0; border:0; margin:0;
  background:transparent; cursor:pointer; z-index:2; touch-action:manipulation;
  transition:transform .12s steps(2);
}
.clue::after{ content:""; position:absolute; inset:-16%; }
.clue:hover{ transform:scale(1.07); }
.clue:focus-visible{ outline-offset:3px; }
.clue-glow{
  position:absolute; inset:-10%; border-radius:50%;
  background:radial-gradient(circle, rgba(244,215,106,.8) 0%, rgba(244,215,106,.35) 45%, rgba(244,215,106,0) 70%);
  animation:glow 2.6s ease-in-out infinite;
}
.clue-art{ position:absolute; inset:5%; display:block; animation:hover 2.6s ease-in-out infinite; }
.clue-art svg{ width:100%; height:100%; }
.clue-spark{ position:absolute; right:-8%; top:-10%; width:34%; animation:twinkle 1.8s ease-in-out infinite; }
.clue-spark svg{ width:100%; height:auto; }
.clue-check{
  position:absolute; right:-6%; bottom:-6%; width:40%; aspect-ratio:1/1;
  display:none; place-items:center; background:var(--teal-d); color:var(--cream-l);
  font:900 clamp(10px, 1.8cqw, 17px)/1 var(--mono); box-shadow:0 0 0 3px var(--ink);
}
.clue.found .clue-glow, .clue.found .clue-spark{ display:none; }
.clue.found .clue-art{ animation:none; opacity:.7; filter:saturate(.75); }
.clue.found .clue-check{ display:grid; }
.clue.pop{ animation:pop .4s steps(4); }
.room-bunny{
  position:absolute; right:.5%; bottom:1%; width:22%; height:42%; z-index:1;
  padding:0; border:0; margin:0; background:transparent; cursor:pointer;
}
.room-bunny .anim{ display:block; }
.room-banner{
  position:absolute; left:50%; top:44%; z-index:5; pointer-events:none; white-space:nowrap;
  transform:translate(-50%,-50%) scale(0); opacity:0;
  background:var(--yellow); color:var(--ink); padding:12px 18px 11px;
  font:900 clamp(15px, 3.4cqw, 28px)/1 var(--mono); letter-spacing:.06em;
  box-shadow:var(--pxb), 8px 8px 0 4px rgba(38,59,58,.25);
}
.room-banner.show{ animation:banner 2.4s ease both; }
.inv-actions{ display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:12px; }
.inv-hint{ margin:0; flex:1; font:700 13px/1.35 var(--mono); color:var(--teal-d); }
.btn .lock{ width:16px; display:inline-block; }
.btn .lock svg{ width:100%; height:auto; }
.btn.ready{ animation:ready 1.6s ease-in-out infinite; }

/* ---------- SPOOKY CUTSCENE ---------- */
.scene-haunt .shade{
  position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity 1.4s ease;
  background:radial-gradient(circle at 62% 34%, rgba(28,78,78,.62), rgba(10,22,21,.97) 70%);
}
.scene-haunt .shade.lv1{ opacity:.4; }
.scene-haunt .shade.lv2{ opacity:.93; }
.scene-haunt .shade.lv3{ opacity:.72; }
.scene-haunt .shade.flicker{ animation:flicker 2.4s linear; }
.scene-haunt .sprite.bunny{ left:1%; right:auto; margin:0; width:min(50%, 320px); height:84%; }
.scene-haunt .sprite.ghost{ right:0; left:auto; margin:0; width:min(58%, 380px); height:90%; bottom:-20px; }
.scene-haunt .sprite.ghost .anim{ filter:drop-shadow(0 0 16px rgba(191,229,223,.75)); }
.scene-haunt .sprite.bunny .anim{ transition:filter 1.4s ease; }
.scene-haunt.dim .sprite.bunny .anim{ filter:brightness(.72) saturate(.8); }
.sprite.boo{ animation:boo .5s cubic-bezier(.2,1.5,.4,1) both; }
.ghost-eyes{ position:absolute; z-index:2; left:62%; top:16%; display:flex; gap:26px; opacity:0; transition:opacity 1.2s ease; pointer-events:none; }
.ghost-eyes.on{ opacity:1; }
.ghost-eyes i{ display:block; width:15px; height:22px; border-radius:50%; background:var(--teal-l); box-shadow:0 0 14px 5px rgba(191,229,223,.7); animation:blink 4.5s ease-in-out infinite; }
.scene.shake{ animation:shake .45s linear; }
.dlg-portrait.dark{ background:#16302F; }

/* ---------- THE LAST DOOR ---------- */
.scene-door .bg > svg{ transform-origin:50% 51%; transition:transform .8s cubic-bezier(.3,.7,.3,1); }
.scene-door.lv1 .bg > svg{ transform:scale(1.07); }
.scene-door.lv2 .bg > svg{ transform:scale(1.16); }
.scene-door.lv3 .bg > svg{ transform:scale(1.27); }
.scene-door.lv4 .bg > svg{ transform:scale(1.4); }
.door-glow{ opacity:.45; transition:opacity .7s ease; transform-box:fill-box; transform-origin:center; animation:glowPulse 2.6s ease-in-out infinite; }
.door-beam{ opacity:.2; transition:opacity .7s ease; }
.scene-door.lv1 .door-glow{ opacity:.6; }   .scene-door.lv1 .door-beam{ opacity:.28; }
.scene-door.lv2 .door-glow{ opacity:.75; }  .scene-door.lv2 .door-beam{ opacity:.36; }
.scene-door.lv3 .door-glow{ opacity:.88; }  .scene-door.lv3 .door-beam{ opacity:.45; }
.scene-door.lv4 .door-glow{ opacity:1; }    .scene-door.lv4 .door-beam{ opacity:.55; }
.door-panel{ transform-box:fill-box; transform-origin:0% 50%; transition:transform 1.1s cubic-bezier(.5,0,.3,1); }
.scene-door.opened .door-panel{ transform:scaleX(.08); }
.door-light{ transition:fill .6s ease; }
.scene-door.opened .door-light{ fill:#FFFDF7; }
.scene-door .sprite.bunny{ left:1%; right:auto; margin:0; width:min(36%, 260px); height:72%; }
.scene-door .sprite.ghost{ right:0; left:auto; margin:0; width:min(38%, 280px); height:78%; }
.scene-door .sprite.ghost .anim{ filter:drop-shadow(0 0 14px rgba(191,229,223,.7)); }
.sprite.vanish{ animation:vanish 1s ease forwards; }
.countdown{ position:absolute; inset:0; z-index:7; display:grid; place-items:center; pointer-events:none; }
.countdown span{
  font:900 120px/1 var(--mono); font-size:clamp(84px, min(26cqw, 26cqh), 200px); color:var(--yellow);
  text-shadow:5px 0 0 var(--ink), -5px 0 0 var(--ink), 0 5px 0 var(--ink), 0 -5px 0 var(--ink),
              5px 5px 0 var(--ink), -5px 5px 0 var(--ink), 5px -5px 0 var(--ink), -5px -5px 0 var(--ink), 10px 11px 0 var(--pink-d);
  animation:countPop .8s ease-out both;
}
.door-prompt{
  position:absolute; z-index:8; left:0; right:0; top:max(14px, 7%); width:max-content; margin:0 auto; white-space:nowrap;
  font:900 clamp(13px, 2.6cqw, 18px)/1 var(--mono); letter-spacing:.1em; color:var(--ink);
  background:var(--yellow); padding:10px 14px 9px; box-shadow:var(--pxb), 6px 6px 0 4px rgba(0,0,0,.25);
  animation:ready 1.6s ease-in-out infinite;
}
.door-btn{
  position:absolute; z-index:8; padding:0; margin:0; border:0; cursor:pointer; background:rgba(255,240,181,.08);
  box-shadow:0 0 0 4px var(--yellow), 0 0 26px 10px rgba(255,240,181,.75);
  animation:doorBtn 1.4s ease-in-out infinite;
}
.door-btn::after{ content:""; position:absolute; inset:-14px; }
.door-btn:focus-visible{ outline:3px dashed var(--yellow); outline-offset:10px; }
.flood{
  position:absolute; inset:0; z-index:20; pointer-events:none; opacity:0; transform:scale(.35);
  background:radial-gradient(circle at 50% 50%, #FFFDF7 0%, #FFF0B5 45%, rgba(255,240,181,0) 72%);
  transition:opacity 1s ease .35s, transform 1.3s ease .35s;
}
.scene-door.opened .flood{ opacity:1; transform:scale(2.6); }

/* ---------- ENDINGS: whole cast ---------- */
.scene-end .sprite.main{ z-index:2; width:min(50%, 380px); }
.scene-end .sprite.side{ z-index:1; width:min(38%, 290px); height:80%; bottom:-24px; }
.scene-end .sprite.side.left{ left:0; right:auto; margin:0; }
.scene-end .sprite.side.right{ right:0; left:auto; margin:0; }
.scene-end .sprite.ghost .anim, .scene-end .sprite.side.right .anim{ filter:drop-shadow(0 0 12px rgba(191,229,223,.6)); }
.cast-label{ margin:12px 0 7px; font:900 11px/1 var(--mono); letter-spacing:.32em; color:var(--teal-d); }
.cast-row{ display:flex; justify-content:center; flex-wrap:wrap; gap:clamp(10px, 2.6cqw, 22px); }
.cast{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.cast-face{ width:clamp(40px, 7cqw, 56px); aspect-ratio:1/1; background:var(--teal-l); box-shadow:0 0 0 3px var(--ink); overflow:hidden; display:grid; place-items:center; }
.cast-face svg{ width:100%; height:100%; display:block; }
.cast-face.bunny{ background:var(--pink-l); }
.cast-face.you{ background:var(--yellow-l); }
.cast-face.you svg{ width:70%; height:70%; }
.cast-name{ font:900 11px/1 var(--mono); letter-spacing:.1em; color:var(--ink); }

/* ---------- TRIAL ---------- */
.trial-bg{ background:radial-gradient(120% 90% at 50% 32%, #2F8384 0%, #286F70 42%, #1B4A4B 100%); }
.trial-bg .rays{
  position:absolute; left:50%; top:34%; width:240vmax; height:240vmax; margin:-120vmax 0 0 -120vmax;
  background:repeating-conic-gradient(rgba(191,229,223,.09) 0deg 7deg, transparent 7deg 18deg);
  animation:spin 70s linear infinite;
}
.trial-bg .floor{
  position:absolute; left:50%; bottom:-26%; width:150%; aspect-ratio:3/1; transform:translateX(-50%); border-radius:50%;
  background:repeating-radial-gradient(ellipse at center, rgba(248,214,229,.18) 0 4px, transparent 4px 26px);
}
.trial-stage{ display:flex; flex-direction:column; align-items:center; gap:clamp(4px, 1.4cqh, 12px); padding:clamp(8px, 2cqh, 18px) 14px 0; }
.trial-title{
  margin:0; text-align:center; font-family:var(--mono); font-weight:900; line-height:1;
  font-size:34px; font-size:clamp(24px, min(6.4cqw, 6.6cqh), 48px); letter-spacing:.06em; color:var(--yellow);
  text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
               3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 6px 7px 0 var(--pink-d);
  animation:slam .5s steps(5) both;
}
.trial-title small{ display:block; margin-bottom:6px; font-size:.32em; letter-spacing:.4em; color:var(--pink); text-shadow:2px 2px 0 var(--ink); }
.trial-cast{ position:relative; flex:1 1 0; min-height:52px; width:100%; max-width:760px; }
.trial-ghost{ position:absolute; inset:0; margin:auto; width:min(46%, 260px); height:100%; }
.trial-ghost .anim{ filter:drop-shadow(0 0 12px rgba(191,229,223,.65)); }
.trial-bunny{ position:absolute; left:2%; bottom:0; width:min(24%, 140px); height:82%; }
.trial-bunny .anim{ position:absolute; left:0; right:0; top:0; bottom:14%; width:auto; height:auto; }
.podium{
  position:absolute; left:6%; right:6%; bottom:0; height:28%;
  background:var(--cream); box-shadow:var(--pxb3), inset 0 -6px 0 0 var(--cream-d);
  display:grid; place-items:center;
}
.podium svg{ width:22%; max-width:26px; height:auto; }
.trial-panel{
  position:relative; width:min(100%, 760px); margin:4px; padding:14px 14px 10px;
  background:var(--cream); color:var(--text);
  box-shadow:var(--pxb), inset 0 0 0 4px var(--pink), 8px 8px 0 4px rgba(0,0,0,.25);
  transition:opacity .3s ease, transform .3s ease;
}
.trial-panel.is-hidden{ transform:translateY(10px); }
.q{ margin:0 0 12px; text-align:center; font:900 clamp(16px, 2.6cqw, 23px)/1.2 var(--mono); color:var(--ink); letter-spacing:.06em; }
.q .st{ color:var(--yellow-d); }
.answers{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
.ans{
  -webkit-appearance:none; appearance:none; border:0; margin:4px; cursor:pointer;
  display:flex; align-items:center; gap:10px; text-align:left;
  min-height:56px; padding:6px 10px; background:var(--cream-l); color:var(--ink);
  font:900 clamp(14px, 1.7cqw, 17px)/1.15 var(--mono); letter-spacing:.04em;
  box-shadow:var(--pxb), inset 0 -4px 0 0 var(--cream-d);
  transition:transform .08s steps(2), background-color .15s;
}
.ans:hover{ background:var(--yellow-l); transform:translateY(-2px); }
.ans:active{ transform:translateY(2px); }
.ans .face{ flex:none; width:42px; height:42px; background:var(--teal-l); box-shadow:0 0 0 3px var(--ink); overflow:hidden; }
.ans .face svg{ width:100%; height:100%; display:block; }
.ans .ans-label{ flex:1; }
.ans .ans-mark{ flex:none; font:900 20px/1 var(--mono); }
.ans.tried{ background:var(--cream-d); }
.ans.tried .ans-label{ text-decoration:line-through; text-decoration-thickness:2px; }
.ans.tried .ans-mark{ color:#A84B78; }
.ans.right{ background:var(--yellow); }
.ans:disabled{ cursor:default; transform:none; }
.feedback{ min-height:1.4em; margin:8px 0 2px; text-align:center; font:800 15px/1.3 var(--mono); }
.feedback.bad{ color:#A84B78; }
.feedback.good{ color:var(--teal-d); }
.stamp{
  position:absolute; left:50%; top:50%; z-index:10; pointer-events:none; white-space:nowrap;
  padding:10px 18px 9px; font:900 clamp(24px, 5cqw, 42px)/1 var(--mono); letter-spacing:.04em;
  color:#A84B78; background:var(--cream-l); border:5px solid var(--pink-d); box-shadow:0 0 0 4px var(--ink), 8px 8px 0 4px rgba(0,0,0,.25);
  animation:stamp 1.1s ease forwards;
}
.verdict{ display:grid; justify-items:center; gap:10px; padding:6px 0 4px; text-align:center; font-family:var(--mono); font-weight:900; }
.verdict > div{ animation:slam .45s steps(5) both; }
.verdict .v1{ font-size:clamp(28px, 6cqw, 50px); background:var(--yellow); color:var(--ink); padding:8px 16px 6px; box-shadow:var(--pxb); }
.verdict .v2{ font-size:clamp(20px, 3.8cqw, 32px); color:var(--teal-d); letter-spacing:.08em; animation-delay:.5s; }
.verdict .v3{ font-size:clamp(14px, 2.4cqw, 19px); color:#A84B78; letter-spacing:.06em; animation-delay:1s; }

/* ---------- SECRET ROOM / CONFESSION / ENDINGS ---------- */
.scene-confess .sprite{ width:min(96%, 490px); height:calc(100% + 26px); bottom:-46px; }
.tint{ position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(circle at 50% 42%, rgba(255,240,181,.38), rgba(242,167,198,.42)); animation:tint 5s ease-in-out infinite alternate; }
.vignette{ position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(201,108,151,.28) 100%); }
.choices{ display:flex; justify-content:center; gap:clamp(14px, 4cqw, 32px); padding:6px 4px 2px; animation:popIn .45s steps(5) both; }
.choices .btn{ flex:1 1 0; max-width:260px; font-size:clamp(20px, 3cqw, 26px); min-height:64px; }
.sunburst{
  position:absolute; left:50%; top:42%; z-index:1; width:220vmax; height:220vmax; margin:-110vmax 0 0 -110vmax; pointer-events:none;
  background:repeating-conic-gradient(rgba(255,240,181,.55) 0deg 10deg, rgba(255,250,240,0) 10deg 20deg);
  animation:spin 60s linear infinite;
}
.soft-veil{ position:absolute; inset:0; z-index:1; pointer-events:none; background:rgba(255,250,240,.42); }
.frame{
  position:absolute; inset:0; z-index:5; pointer-events:none;
  box-shadow: inset 0 0 0 6px var(--teal), inset 0 0 0 10px var(--cream-l), inset 0 0 0 14px var(--pink), inset 0 0 0 16px var(--ink);
}
.frame span{ position:absolute; width:26px; }
.frame span svg{ width:100%; height:auto; }
.frame .c1{ left:18px; top:18px; } .frame .c2{ display:none; }
.frame .c3{ left:18px; bottom:18px; } .frame .c4{ right:18px; bottom:18px; }
.scene-end .bottom{ padding:0 30px 30px; }
.scene-end .top{ padding:30px 30px 0; }
.end-card{
  max-width:660px; margin:24px auto 4px; padding:18px 18px 20px; text-align:center;
  background:var(--cream-l); box-shadow:var(--pxb), inset 0 0 0 4px var(--pink-l), 8px 8px 0 4px rgba(38,59,58,.2);
  animation:popIn .55s steps(5) both;
}
.end-hearts{ display:flex; justify-content:center; gap:8px; margin-bottom:8px; }
.end-hearts span{ width:18px; display:block; }
.end-hearts svg{ width:100%; height:auto; }
.end-card h2{ margin:0; font:900 clamp(20px, 3.6cqw, 32px)/1.15 var(--mono); color:var(--ink); letter-spacing:.04em; }
.end-card h2 .num{ display:block; margin-bottom:6px; font-size:.5em; letter-spacing:.36em; color:var(--teal-d); }
.end-card .msg{ margin:12px auto 16px; max-width:34em; font:700 clamp(16px, 1.2cqw + 9px, 20px)/1.5 var(--round); color:var(--text); }

/* ---------- Layout: wide windows (desktop / landscape) ---------- */
@container game (min-aspect-ratio: 6/5){
  .scene-inv{ display:grid; grid-template-columns:minmax(0, 1.7fr) minmax(270px, 1fr); grid-template-rows:1fr auto auto auto 1fr; }
  .scene-inv .top{ grid-column:2; grid-row:2; justify-content:flex-start; padding-left:4px; }
  .scene-inv .slots{ grid-column:2; grid-row:3; justify-content:flex-start; padding-left:6px; }
  .scene-inv .inv-stage{ grid-column:1; grid-row:1 / 6; }
  .scene-inv .bottom{ grid-column:2; grid-row:4; padding-left:2px; padding-top:8px; }
}
@container game (max-width: 640px){
  .answers{ grid-template-columns:1fr; gap:6px; }
  .ans{ min-height:50px; }
  .dlg{ gap:10px; padding:14px 12px 34px 10px; min-height:112px; }
  .top{ padding:12px 60px 0 12px; }
  .bottom{ padding-left:10px; padding-right:10px; }
  .inv-hint{ font-size:12px; }
}
@container game (max-height: 560px){
  .chip, .hint, .trial-title small{ display:none; }
  .dlg{ min-height:88px; margin-top:22px; padding-top:12px; padding-bottom:30px; }
  .dlg-portrait{ width:52px; }
  .dlg-text{ font-size:15px; min-height:2.6em; }
  .scene-inv .tag{ display:none; }
  .slots{ padding-top:2px; }
  .slot{ width:34px; }
  .inv-actions{ margin-top:8px; }
  .btn{ min-height:46px; padding:10px 16px; }
  .btn.big{ min-height:52px; padding:12px 24px; }
  .choices .btn{ min-height:52px; }
  .end-card{ padding:12px 14px 14px; margin-top:16px; }
  .end-card .msg{ margin:8px auto 10px; }
  .end-hearts, .cast-label, .cast-row{ display:none; }
  .top{ padding-top:8px; }
}
@container game (max-height: 560px) and (min-aspect-ratio: 3/2){
  .trial-stage{ display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.7fr); grid-template-rows:auto 1fr; align-items:center; column-gap:14px; }
  .trial-title{ grid-column:1 / -1; }
  .trial-cast{ grid-column:1; grid-row:2; height:100%; }
  .trial-panel{ grid-column:2; grid-row:2; }
  .answers{ gap:8px; }
}

/* ---------- Keyframes ---------- */
@keyframes sceneIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes cellIn{ from{ transform:scale(0); } to{ transform:scale(1.04); } }
@keyframes cellOut{ from{ transform:scale(1.04); } to{ transform:scale(0); } }
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
@keyframes ghostFloat{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-12px) rotate(2deg); } }
@keyframes hop{ 0%,100%{ transform:translateY(0); } 40%{ transform:translateY(-16px); } }
@keyframes jump{ 0%,100%{ transform:translateY(0) scale(1,1); } 15%{ transform:translateY(0) scale(1.06,.94); } 45%{ transform:translateY(-36px) scale(.97,1.04); } }
@keyframes breath{ 0%,100%{ transform:scale(1,1); } 50%{ transform:scale(1.03,1.05) translateY(-4px); } }
@keyframes giggle{ 0%,100%{ transform:translateX(0) rotate(0); } 20%{ transform:translateX(-7px) rotate(-4deg); } 40%{ transform:translateX(7px) rotate(4deg); } 60%{ transform:translateX(-4px) rotate(-2deg); } 80%{ transform:translateX(4px) rotate(2deg); } }
@keyframes twirl{ 0%{ transform:rotate(0) scale(1); } 50%{ transform:rotate(180deg) scale(1.12); } 100%{ transform:rotate(360deg) scale(1); } }
@keyframes shiver{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-3px); } 75%{ transform:translateX(3px); } }
@keyframes exitLeft{ to{ transform:translateX(-130%); opacity:0; } }
@keyframes poof{ 0%{ transform:scale(.35) translateY(40px); opacity:0; } 60%{ transform:scale(1.08); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
@keyframes ear{ 0%,86%,100%{ transform:rotate(0); } 90%{ transform:rotate(9deg); } 94%{ transform:rotate(-4deg); } }
@keyframes orb{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-9px); } }
@keyframes flame{ 0%,100%{ transform:scale(1,1); } 50%{ transform:scale(1.08,.92); } }
@keyframes wave{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(-16deg); } }
@keyframes bulb{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
@keyframes fUp{ 0%{ transform:translate(0,0); } 25%{ transform:translate(var(--sw),-30vh); } 50%{ transform:translate(0,-60vh); } 75%{ transform:translate(calc(var(--sw) * -1),-90vh); } 100%{ transform:translate(0,-125vh); } }
@keyframes fFall{ 0%{ transform:translate(0,0) rotate(0deg); } 50%{ transform:translate(var(--sw),62vh) rotate(180deg); } 100%{ transform:translate(0,125vh) rotate(360deg); } }
@keyframes fTw{ 0%,100%{ transform:scale(.5); opacity:.35; } 50%{ transform:scale(1); opacity:1; } }
@keyframes drift{ from{ transform:translateX(-14px); } to{ transform:translateX(26px); } }
@keyframes burst{ 0%{ transform:translate(0,0) scale(.3); opacity:1; } 100%{ transform:translate(var(--dx),var(--dy)) scale(1.1); opacity:0; } }
@keyframes nudge{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(3px); } }
@keyframes flip{ 0%{ transform:rotateX(0); } 50%{ transform:rotateX(90deg); } 100%{ transform:rotateX(0); } }
@keyframes glow{ 0%,100%{ opacity:.55; transform:scale(.92); } 50%{ opacity:1; transform:scale(1.06); } }
@keyframes hover{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4%); } }
@keyframes twinkle{ 0%,100%{ transform:scale(.6) rotate(0); } 50%{ transform:scale(1) rotate(45deg); } }
@keyframes pop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.22); } 70%{ transform:scale(.94); } 100%{ transform:scale(1); } }
@keyframes ready{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
@keyframes banner{ 0%{ transform:translate(-50%,-50%) scale(0); opacity:0; } 12%{ transform:translate(-50%,-50%) scale(1.15); opacity:1; } 20%{ transform:translate(-50%,-50%) scale(1); opacity:1; } 82%{ transform:translate(-50%,-50%) scale(1); opacity:1; } 100%{ transform:translate(-50%,-50%) scale(1); opacity:0; } }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes slam{ 0%{ transform:scale(2.2); opacity:0; } 60%{ transform:scale(.94); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
@keyframes stamp{ 0%{ transform:translate(-50%,-50%) rotate(-8deg) scale(1.8); opacity:0; } 14%{ transform:translate(-50%,-50%) rotate(-8deg) scale(.95); opacity:1; } 22%{ transform:translate(-50%,-50%) rotate(-8deg) scale(1); opacity:1; } 78%{ opacity:1; transform:translate(-50%,-50%) rotate(-8deg) scale(1); } 100%{ opacity:0; transform:translate(-50%,-50%) rotate(-8deg) scale(1); } }
@keyframes popIn{ 0%{ transform:scale(.6); opacity:0; } 70%{ transform:scale(1.04); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
@keyframes tint{ from{ opacity:.55; } to{ opacity:1; } }
@keyframes flicker{ 0%{ opacity:0; } 15%{ opacity:.45; } 30%{ opacity:.1; } 55%{ opacity:.5; } 70%{ opacity:.22; } 100%{ opacity:.4; } }
@keyframes boo{ 0%{ transform:scale(.3) translateY(30%); opacity:0; } 60%{ transform:scale(1.12); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
@keyframes blink{ 0%,90%,100%{ transform:scaleY(1); } 94%{ transform:scaleY(.12); } }
@keyframes shake{ 0%,100%{ transform:translate(0,0); } 20%{ transform:translate(-6px,3px); } 40%{ transform:translate(6px,-3px); } 60%{ transform:translate(-4px,2px); } 80%{ transform:translate(4px,-2px); } }
@keyframes glowPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.07); } }
@keyframes vanish{ to{ opacity:0; transform:translateY(-34px) scale(.9); } }
@keyframes countPop{ 0%{ transform:scale(2.4); opacity:0; } 35%{ transform:scale(.92); opacity:1; } 55%{ transform:scale(1.04); } 80%{ opacity:1; } 100%{ transform:scale(1); opacity:.9; } }
@keyframes doorBtn{ 0%,100%{ box-shadow:0 0 0 4px var(--yellow), 0 0 22px 8px rgba(255,240,181,.6); } 50%{ box-shadow:0 0 0 4px var(--yellow), 0 0 34px 16px rgba(255,240,181,.95); } }
@keyframes caret{ 0%{ opacity:1; } 100%{ opacity:0; } }

function pixelGrid(rows, outlines) {
  const pad = outlines.length;
  const w0 = Math.max(...rows.map(r => r.length));
  const W = w0 + pad * 2, H = rows.length + pad * 2;
  const g = [];
  for (let y = 0; y < H; y++) g.push(new Array(W).fill('.'));
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) g[y + pad][x + pad] = r[x]; });
  outlines.forEach(color => {
    const add = [];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (g[y][x] !== '.') continue;
        const near = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
          const row = g[y + dy];
          const v = row && row[x + dx];
          return v && v !== '.';
        });
        if (near) add.push([x, y]);
      }
    }
    add.forEach(([x, y]) => { g[y][x] = color; });
  });
  return g;
}

const pixelCache = {};
function pixelSVG(name, cls = '', align = 'xMidYMid') {
  const def = PIXELS[name];
  if (!def) return '';
  if (!pixelCache[name]) {
    const g = pixelGrid(def.rows, def.outline || []);
    const paths = {};
    g.forEach((row, y) => {
      let x = 0;
      while (x < row.length) {
        const ch = row[x];
        if (ch === '.' || !PAL[ch]) { x++; continue; }
        let run = 1;
        while (x + run < row.length && row[x + run] === ch) run++;
        (paths[ch] = paths[ch] || []).push(`M${x} ${y}h${run}v1h-${run}z`);
        x += run;
      }
    });
    pixelCache[name] = {
      w: g[0].length, h: g.length,
      body: Object.keys(paths).map(ch => `<path fill="${PAL[ch]}" d="${paths[ch].join('')}"/>`).join('')
    };
  }
  const p = pixelCache[name];
  return `<svg xmlns="http://www.w3.org/2000/svg" class="px ${cls}" width="${p.w}" height="${p.h}" viewBox="0 0 ${p.w} ${p.h}" preserveAspectRatio="${align} meet" shape-rendering="crispEdges" aria-hidden="true" focusable="false">${p.body}</svg>`;
}


/* =============================================================
   3. SVG HELPERS
   ============================================================= */
function star5(cx, cy, R, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r : R;
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rad).toFixed(1) + ' ' + (cy + Math.sin(a) * rad).toFixed(1);
  }
  return d + 'Z';
}
function heartPath(cx, cy, s) {
  const k = s / 20;
  const f = n => (Math.round(n * 10) / 10);
  return `M${f(cx)} ${f(cy + 16 * k)} C${f(cx - 22 * k)} ${f(cy + 2 * k)} ${f(cx - 18 * k)} ${f(cy - 16 * k)} ${f(cx - 8 * k)} ${f(cy - 16 * k)} ` +
         `C${f(cx - 3 * k)} ${f(cy - 16 * k)} ${f(cx)} ${f(cy - 12 * k)} ${f(cx)} ${f(cy - 8 * k)} ` +
         `C${f(cx)} ${f(cy - 12 * k)} ${f(cx + 3 * k)} ${f(cy - 16 * k)} ${f(cx + 8 * k)} ${f(cy - 16 * k)} ` +
         `C${f(cx + 18 * k)} ${f(cy - 16 * k)} ${f(cx + 22 * k)} ${f(cy + 2 * k)} ${f(cx)} ${f(cy + 16 * k)} Z`;
}
// Messy spiky hair silhouette (deterministic so it never changes between renders).
function spiky(cx, cy, r1, r2, n, a0, a1, seed) {
  const pts = [];
  const steps = n * 2;
  for (let i = 0; i <= steps; i++) {
    const a = (a0 + (a1 - a0) * (i / steps)) * Math.PI / 180;
    const j = Math.abs((Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453) % 1);
    const r = i % 2 ? r2 - j * 12 : r1 + j * 4;
    pts.push((cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r).toFixed(1));
  }
  return 'M' + pts.join(' L') + ' Z';
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

    dialogueIndex: 0,        // current line in the active dialogue

    trialOpen: false,        // answers can be chosen
    hauntingSeen: false,     // spooky cutscene finished
    trialComplete: false,    // correct answer given
    wrongAnswers: new Set(), // wrong answers tried
    selectedAnswer: null,    // last answer clicked in the trial
    doorOpened: false,       // the last door has been opened
    secretRoomSeen: false,   // secret room dialogue finished
    nameRevealed: false,     // true after the confession reveal
    confessionAnswered: false,
    ending: null,            // 'happy' | 'honest'
    busy: false              // true during transitions / short animations
  };
}

/* =============================================================
   8b. SOUND: everything is synthesized with the Web Audio API
   (no audio files, so it works offline and on GitHub Pages).
   ============================================================= */
const Sound = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  let enabled = true;
  try { if (localStorage.getItem('torei-sound') === 'off') enabled = false; } catch (e) { /* storage may be blocked */ }
  let track = null, trackName = null, step = 0, nextTime = 0, sched = null;

  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function nf(name) {
    const m = /^([A-G])(#|b)?(\d)$/.exec(name);
    if (!m) return 0;
    const n = SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) + 1) * 12;
    return 440 * Math.pow(2, (n - 69) / 12);

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain(); master.gain.value = enabled ? 1 : 0; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = SOUND_VOLUME; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = MUSIC_VOLUME; musicBus.connect(master);
    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 1.5), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);

  function tone(o) {

    const dur = o.dur || 0.1, vol = o.vol == null ? 0.2 : o.vol;
    const a = Math.min(o.attack || 0.004, dur * 0.5);

    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      o2.frequency.setValueAtTime(o.freq * 2, t);

      o2.start(t); o2.stop(t + dur + 0.03);

    f.frequency.setValueAtTime(o.freq || 2000, t);
    if (o.slide) f.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    if (o.q) f.Q.value = o.q;

    const a = Math.min(o.attack || 0.002, dur * 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    hall: { step: 0.25, bar: 8, perc: { hat: true, kick: [0, 4] }, voices: [
      { notes: seq('A2 A3 A2 A3 A2 A3 A2 A3 | F2 F3 F2 F3 F2 F3 F2 F3 | G2 G3 G2 G3 G2 G3 G2 G3 | E2 E3 E2 E3 E2 E3 G#2 G#3'), type: 'triangle', vol: 0.14, len: 0.8 },

  function startMusic() {

    nextTime = ctx.currentTime + 0.08;
    sched = setInterval(scheduleNotes, 25);

  function stopMusic() { clearInterval(sched); sched = null; }
  function scheduleNotes() {
    if (!ctx || !track) return;
    const sd = track.step;
    if (nextTime < ctx.currentTime - 0.2) nextTime = ctx.currentTime + 0.05;   // skip ahead after a pause

      if (p.kick && p.kick.indexOf(b) >= 0) tone({ at: nextTime, type: 'sine', freq: 120, slide: 45, dur: 0.14, vol: 0.26, bus: musicBus });
      if (p.clap && p.clap.indexOf(b) >= 0) noise({ at: nextTime, filter: 'bandpass', freq: 1500, q: 1, dur: 0.08, vol: 0.06, bus: musicBus });
      if (p.clock && b % 2 === 0) tone({ at: nextTime, type: 'sine', freq: b % 4 === 0 ? 1650 : 1250, dur: 0.03, vol: 0.045, bus: musicBus });

      step++;

  function music(name) {
    if ((name || null) === trackName) return;
    trackName = name || null;
    track = TRACKS[trackName] || null;
    step = 0;
    stopMusic();
    if (ctx && track && enabled) startMusic();
  }
  // Briefly lower the music (used for the big confession line).
  function duck(level, ms) {
    if (!ctx || !enabled) return;
    const g = musicBus.gain, t = ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(MUSIC_VOLUME * level, t + 0.3);
    g.setValueAtTime(MUSIC_VOLUME * level, t + ms / 1000);
    g.linearRampToValueAtTime(MUSIC_VOLUME, t + ms / 1000 + 1.2);
  }
  function setEnabled(on) {
    enabled = on;
    try { localStorage.setItem('torei-sound', on ? 'on' : 'off'); } catch (e) { /* ignore */ }
    if (on) {
      if (!init()) return;
      master.gain.value = 1;
      if (ctx.state === 'suspended') ctx.resume();
      if (track) startMusic();
    } else {
      if (master) master.gain.value = 0;
      stopMusic();
    }
  }
  function pageHidden(hidden) {
    if (!ctx) return;
    if (hidden) { stopMusic(); if (ctx.state === 'running') ctx.suspend(); }

  return { play, music, duck, unlock, setEnabled, pageHidden, get enabled() { return enabled; }, _tracks: TRACKS };
})();

   9. SPRITES & EFFECTS

const sprites = {};

function setupSprite(scene, name, fn, mood, opts = {}, idle = 'bob') {
  const el = scene.querySelector(`[data-sprite="${name}"]`);
  if (!el) return null;
  const anim = el.querySelector('.anim');
  sprites[name] = { el, anim, fn, mood, opts: Object.assign({}, opts), idle };
  anim.innerHTML = fn(Object.assign({}, opts, { mood }));
  if (idle) anim.classList.add(idle);
  return sprites[name];
}
function setSprite(name, change = {}) {
  const s = sprites[name];
  if (!s) return;
  let dirty = false;
  if (change.mood && change.mood !== s.mood) { s.mood = change.mood; dirty = true; }
  if (change.prop !== undefined && change.prop !== s.opts.prop) { s.opts.prop = change.prop; dirty = true; }
  if (dirty) s.anim.innerHTML = s.fn(Object.assign({}, s.opts, { mood: s.mood }));
}
function playAnim(name, cls, ms) {
  const s = sprites[name];

  s.anim.classList.remove('bob', 'float', 'hop', 'jump', 'breath', 'giggle', 'twirl', 'shiver');
  void s.anim.offsetWidth;
  s.anim.classList.add(cls);
  later(() => { s.anim.classList.remove(cls); if (s.idle) s.anim.classList.add(s.idle); }, ms);
}

function spawnFloaters(fx, o = {}) {
  if (!fx) return;
  const { count = 12, kinds = ['heart'], mode = 'up', min = 14, max = 28, opacity = 0.9 } = o;
  const n = REDUCED ? Math.ceil(count / 2) : count;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'floater ' + (REDUCED ? 'still' : mode);
    s.innerHTML = pixelSVG(kinds[i % kinds.length]);
    s.style.setProperty('--x', rand(2, 94).toFixed(1) + '%');
    s.style.setProperty('--y', rand(4, 70).toFixed(1) + '%');
    s.style.setProperty('--s', Math.round(rand(min, max)) + 'px');
    s.style.setProperty('--d', rand(7, 13).toFixed(1) + 's');
    s.style.setProperty('--dl', (-rand(0, 12)).toFixed(1) + 's');
    s.style.setProperty('--sw', Math.round(rand(-40, 40)) + 'px');
    s.style.setProperty('--o', opacity);
    frag.appendChild(s);
  }
  fx.appendChild(frag);
}
function burstAt(target, o = {}) {
  if (REDUCED || !target || !target.isConnected) return;
  const { n = 10, kinds = ['star', 'sparkle'], spread = 70 } = o;
  const g = root.getBoundingClientRect(), r = target.getBoundingClientRect();
  const cx = r.left + r.width / 2 - g.left, cy = r.top + r.height / 2 - g.top;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span');
    p.className = 'burst';
    p.innerHTML = pixelSVG(kinds[i % kinds.length]);
    const a = (i / n) * Math.PI * 2 + rand(-0.3, 0.3), d = rand(spread * 0.5, spread);
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--dx', Math.round(Math.cos(a) * d) + 'px');
    p.style.setProperty('--dy', Math.round(Math.sin(a) * d) + 'px');

/* =============================================================
   10. DIALOGUE SYSTEM (reusable for every scene)
   ============================================================= */
const Dialogue = (() => {
  let el = null, nameEl, nameTxt, portraitEl, textEl, nextBtn;
  let lines = [], idx = 0, onDone = null, holdLast = false;
  let active = false, typing = false, timer = null, fullText = '', shownAt = 0, pendingHold = null;

  function build() {
    el = document.createElement('div');
    el.className = 'dlg';
    el.innerHTML =
      '<div class="dlg-name"><span></span></div>' +
      '<div class="dlg-portrait" aria-hidden="true"></div>' +
      '<p class="dlg-text" aria-hidden="true"><span class="dlg-typed"></span><span class="caret"></span></p>' +
      '<button type="button" class="dlg-next" aria-label="Continue"><span aria-hidden="true">NEXT</span> <span class="tri" aria-hidden="true">▼</span></button>';
    nameEl = el.querySelector('.dlg-name');
    nameTxt = nameEl.querySelector('span');
    portraitEl = el.querySelector('.dlg-portrait');
    textEl = el.querySelector('.dlg-typed');
    nextBtn = el.querySelector('.dlg-next');
    el.addEventListener('click', e => { if (e.target.closest('.dlg-next')) return; advance(); });
    nextBtn.addEventListener('click', e => { e.stopPropagation(); advance(); });
  }
  function mount(container) { if (!el) build(); container.appendChild(el); }
  function unmount() { stop(); if (el) el.remove(); }
  function stop() {
    clearTimeout(timer); timer = null;
    if (el) el.classList.remove('typing');
    typing = false; active = false; lines = []; onDone = null; pendingHold = null;
  }
  // Play a list of lines. `done` runs after the last line (or as soon as it is shown, with holdLast).
  function play(seq, done, opts = {}) {
    stop();
    lines = seq; idx = 0; onDone = done || null; holdLast = !!opts.holdLast; active = true;
    show();
  }
  // Show a single line that does not advance (used for trial feedback).
  function say(line) { stop(); lines = [line]; idx = 0; render(line, false); }

  function show() {
    const line = lines[idx];
    const hold = holdLast && idx === lines.length - 1;
    state.dialogueIndex = idx;
    render(line, !hold);
    if (hold) {
      active = false; pendingHold = onDone; onDone = null;
      if (!typing) firePending();
    }
    if (typeof line.on === 'function') line.on(line);
  }
  function firePending() { const cb = pendingHold; pendingHold = null; if (cb) cb(); }
  function render(line, advanceable) {
    const cast = CAST[line.who] || CAST.narration;
    const name = typeof cast.name === 'function' ? cast.name() : cast.name;
    el.classList.toggle('narration', !!cast.narration);
    el.classList.toggle('static', !advanceable);
    nameEl.className = 'dlg-name ' + (cast.tag || '');
    nameTxt.textContent = name || '';
    if (cast.sprite && (line.mood || line.prop !== undefined)) setSprite(cast.sprite, { mood: line.mood, prop: line.prop });
    const mood = line.mood || (cast.sprite && sprites[cast.sprite] ? sprites[cast.sprite].mood : undefined);
    portraitEl.className = 'dlg-portrait ' + (cast.portraitClass || '');
    portraitEl.innerHTML = cast.portrait ? cast.portrait(mood) : '';
    announce((name ? name + ': ' : '') + line.text);
    shownAt = performance.now();
    type(line.text, line.speed || 1);
  }
  // Typewriter: one letter at a time, a key click per letter, little pauses after punctuation.
  function type(str, speed) {
    clearTimeout(timer);
    fullText = str;
    if (REDUCED || TYPE_SPEED_MS <= 0) { textEl.textContent = str; typing = false; el.classList.remove('typing'); return; }
    const chars = Array.from(str);
    const base = TYPE_SPEED_MS * speed;
    let i = 0;
    typing = true;
    el.classList.add('typing');
    textEl.textContent = '';
    const tick = () => {
      i++;
      textEl.textContent = chars.slice(0, i).join('');
      const ch = chars[i - 1], nx = chars[i];
      if (ch.trim() && (speed >= 1.8 || i % 2 === 1)) Sound.play('key');
      if (i >= chars.length) { finishTyping(); return; }
      let wait = base;
      if ('.!?'.indexOf(ch) >= 0) wait += (nx === '.' || nx === '!' || nx === '?') ? base * 2.5 : base * 7;
      else if (ch === ',' || ch === ':') wait += base * 4;
      timer = setTimeout(tick, wait);
    };
    timer = setTimeout(tick, base);
  }
  function finishTyping() {
    clearTimeout(timer); timer = null; typing = false;
    el.classList.remove('typing');
    textEl.textContent = fullText;
    if (pendingHold) firePending();
  }
  function advance() {
    if (state.busy || !el) return;
    if (typing) { finishTyping(); return; }
    if (!active) return;
    if (performance.now() - shownAt < 200) return;   // avoids accidental double-tap skips
    idx++;
    Sound.play('ret');
    if (idx >= lines.length) {
      active = false;
      el.classList.add('static');
      const cb = onDone; onDone = null;
      if (cb) cb();
      return;
    }
    show();
  }
  function flipName(newName) {
    if (!el) return;
    nameEl.classList.remove('flip'); void nameEl.offsetWidth; nameEl.classList.add('flip');
    setTimeout(() => {
      nameTxt.textContent = newName;
      nameEl.className = 'dlg-name tag-pink revealed flip';
      announce('Name revealed: ' + newName);
      Sound.play('reveal');
      burstAt(nameEl, { n: 10, kinds: ['heart', 'sparkle', 'star'], spread: 60 });
    }, 230);
  }
  return {
    mount, unmount, play, say, stop, advance, flipName,
    canAdvance: () => (active || typing) && !state.busy,
    get nextBtn() { return nextBtn; },
    get index() { return idx; },
    get el() { return el; }
  };
})();

/* ---- Investigation ---- */
function inspectClue(id, scene) {
  if (state.busy) return;
  const clue = CLUES.find(c => c.id === id);
  if (!clue) return;
  const btn = scene.querySelector(`[data-clue="${id}"]`);
  btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');

  if (state.clues.has(id)) {   // already collected: no double counting
    Sound.play('again');
    Dialogue.play([{ who: 'you', text: `${clue.lines[0].text} (Already in your case file ✓)` }]);
    return;
  }
  state.clues.add(id);
  Sound.play('clue');
  btn.classList.add('found');
  btn.setAttribute('aria-label', `${clue.name}: clue collected`);
  burstAt(btn, { n: 10, kinds: ['star', 'sparkle'] });
  flyToSlot(btn, id, scene);
  updateCounter(scene);

  const seq = clue.lines.map(l => Object.assign({}, l));
  if (state.clues.size === CLUES.length) {
    seq.push(Object.assign({}, SCRIPT.allFound));
    unlockContinue(scene);
  }
  Dialogue.play(seq);
}
function flyToSlot(btn, id, scene) {
  const slot = scene.querySelector(`[data-slot="${id}"]`);

  const fill = () => {
    slot.classList.add('filled');
    slot.innerHTML = `${pixelSVG(id)}<span class="sr-only">${clue.name}: found</span>`;
  };
  if (REDUCED) { fill(); return; }
  const g = root.getBoundingClientRect(), a = btn.getBoundingClientRect(), b = slot.getBoundingClientRect();
  const fly = document.createElement('div');
  fly.className = 'fly';
  fly.innerHTML = pixelSVG(id);
  Object.assign(fly.style, { left: (a.left - g.left) + 'px', top: (a.top - g.top) + 'px', width: a.width + 'px', height: a.height + 'px' });
  root.appendChild(fly);
  fly.getBoundingClientRect();
  const sc = (b.width / a.width) * 0.8;
  fly.style.transform = `translate(${b.left - a.left + b.width * 0.1}px, ${b.top - a.top + b.height * 0.1}px) scale(${sc})`;

let pokeCount = 0;
function pokeBunny() {
  if (state.busy) return;
  const line = SCRIPT.bunnyPoke[pokeCount++ % SCRIPT.bunnyPoke.length];
  playAnim('bunny', 'hop', 520);
  Sound.play('boing');
  Dialogue.play([Object.assign({}, line)]);
}
function roomFallback(scene) {
  if (window.CSS && CSS.supports && CSS.supports('width', '1cqw')) return;
  const stage = scene.querySelector('.inv-stage'), room = scene.querySelector('[data-room]');
  const fit = () => {
    const w = stage.clientWidth - 28, hh = stage.clientHeight - 24;
    room.style.width = Math.max(140, Math.min(w, hh * 4 / 3)) + 'px';
  };
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  else window.addEventListener('resize', fit);
}

/* ---- Trial ---- */
function answerTrial(who, scene) {
  if (state.busy || !state.trialOpen || state.trialComplete) return;
  state.selectedAnswer = who;
  const btn = scene.querySelector(`[data-answer="${who}"]`);
  const fb = scene.querySelector('[data-feedback]');
  const panel = scene.querySelector('[data-panel]');

  if (who !== 'bunny') {
    state.wrongAnswers.add(who);
    btn.classList.add('tried');
    btn.querySelector('.ans-mark').textContent = '✗';
    btn.setAttribute('aria-label', btn.querySelector('.ans-label').textContent + ' (wrong answer)');
    stamp(panel, 'WRONG ANSWER!', 'wrong');
    Sound.play('wrong');
    fb.className = 'feedback bad';
    fb.textContent = '✗ Wrong answer! Try again!';
    setSprite('ghost', { mood: 'laugh' });
    playAnim('ghost', 'giggle', 650);
    Dialogue.say({ who: 'ghost', mood: 'laugh', text: SCRIPT.trialWrong[who] });
    return;
  }

  // Correct!
  state.trialComplete = true;
  state.trialOpen = false;
  state.busy = true;
  Sound.play('correct');
  btn.classList.add('right');
  btn.querySelector('.ans-mark').textContent = '✓';
  fb.className = 'feedback good';
  fb.textContent = '✓ Correct!';
  scene.querySelectorAll('[data-answer]').forEach(b => { b.disabled = true; });
  Dialogue.say({ who: 'ghost', mood: 'delight', text: '...!' });
  later(() => {
    panel.innerHTML = `<div class="verdict" role="status"><div class="v1">CORRECT!</div><div class="v2">CASE CLOSED!</div><div class="v3">YOU'VE UNCOVERED THE TRUTH!</div></div>`;
    setSprite('ghost', { mood: 'delight' });
    playAnim('ghost', 'twirl', 950);
    setSprite('bunny', { mood: 'nervous' });
    playAnim('bunny', 'shiver', 850);
    spawnFloaters(scene.querySelector('[data-fx]'), { count: 18, kinds: ['star', 'sparkle'], mode: 'fall', min: 14, max: 24 });
    burstAt(panel, { n: 16, kinds: ['star', 'sparkle'], spread: 200 });
  }, 380);
  later(() => {
    state.busy = false;
    Dialogue.play(SCRIPT.trialWin(), () => goTo('lastDoor', 'darkfade'));
    focusKb(Dialogue.nextBtn);
  }, 1950);
}

/* ---- The last door ---- */
function doorLevel(n) {
  if (!current) return;
  current.classList.remove('lv1', 'lv2', 'lv3', 'lv4');
  current.classList.add('lv' + n);
}
function ghostVanish() {
  const g = sprites.ghost;
  if (!g) return;
  later(() => {
    burstAt(g.anim, { n: 12, kinds: ['sparkle', 'star'], spread: 120 });
    Sound.play('vanish');
    g.el.classList.add('vanish');
  }, 900);
}
function doorCountdown(scene) {
  Sound.music(null);
  const cd = scene.querySelector('[data-countdown]');
  ['1', '2', '3!'].forEach((t, i) => later(() => {
    cd.innerHTML = `<span>${t}</span>`;
    Sound.play('count' + (i + 1));
    doorLevel(i + 2);
    setSprite('bunny', { mood: i === 2 ? 'excited' : 'nervous' });
    if (i === 2) later(() => burstAt(scene.querySelector('.door-light'), { n: 14, kinds: ['sparkle', 'star'], spread: 160 }), 300);
  }, 350 + i * 900));
  later(() => { cd.innerHTML = ''; showDoorPrompt(scene); }, 350 + 3 * 900 + 250);
}
function placeDoorButton(scene) {
  const btn = scene.querySelector('[data-door-btn]'), tgt = scene.querySelector('.door-light');
  if (!btn || !tgt) return;
  const sr = scene.getBoundingClientRect(), r = tgt.getBoundingClientRect();
  Object.assign(btn.style, { left: (r.left - sr.left) + 'px', top: (r.top - sr.top) + 'px', width: r.width + 'px', height: r.height + 'px' });
}
function showDoorPrompt(scene) {
  Dialogue.unmount();   // nothing covers the door now
  scene.classList.add('ready');
  Sound.music('doorwait');
  const btn = scene.querySelector('[data-door-btn]');
  placeDoorButton(scene);
  btn.hidden = false;
  scene.querySelector('[data-door-prompt]').hidden = false;
  announce('Tap the door to open it.');
  later(() => focusKb(btn), 60);
}
function openDoor(scene) {
  if (state.busy || state.doorOpened || !scene.classList.contains('ready')) return;
  state.doorOpened = true;
  Sound.music(null);
  Sound.play('doorOpen');
  scene.querySelector('[data-door-btn]').hidden = true;
  scene.querySelector('[data-door-prompt]').hidden = true;
  setSprite('bunny', { mood: 'happy' });
  scene.classList.add('opened');
  later(() => goTo('secretRoom', 'light'), REDUCED ? 500 : 1500);
}

/* ---- Confession & endings ---- */
function castJoin() {
  let joined = false;
  ['principal', 'ghost'].forEach((n, i) => {
    const s = sprites[n];
    if (!s || !s.el.classList.contains('is-hidden')) return;
    joined = true;
    later(() => {
      s.el.classList.remove('is-hidden');
      s.el.classList.add('poof');
      burstAt(s.anim, { n: 10, kinds: ['sparkle', 'star', 'heart'], spread: 90 });
    }, i * 260);
  });
  if (joined) Sound.play('poof');
}
function castRow(o) {
  const people = [
    ['principal', principalSVG({ crop: true, mood: o.principal }), 'PRINCIPAL'],
    ['ghost', ghostSVG({ crop: true, mood: o.ghost }), 'GHOST'],
    ['bunny', bunnySVG({ crop: true, mood: o.mood }), escapeHTML(BUNNY_NAME.toUpperCase())],
    ['you', pixelSVG('magnifier'), escapeHTML(PLAYER_NAME.toUpperCase())]
  ];
  return `<p class="cast-label">STARRING</p><div class="cast-row" role="list">` +
    people.map(([k, svg, label]) => `<div class="cast" role="listitem"><span class="cast-face ${k}" aria-hidden="true">${svg}</span><span class="cast-name">${label}</span></div>`).join('') +
    `</div>`;
}
function endingScene(cls, label, extra) {
  return h(`<section class="scene scene-vn scene-end ${cls}" aria-label="${label}">
      <div class="bg">${BG.secret(true)}</div>
      ${extra}
      <div class="fx" data-fx></div>
      <div class="stage">
        <div class="sprite side left is-hidden" data-sprite="principal"><div class="anim"></div></div>
        <div class="sprite side right is-hidden" data-sprite="ghost"><div class="anim"></div></div>
        <div class="sprite main" data-sprite="bunny"><div class="anim"></div></div>
      </div>
      <div class="bottom"><div data-dlg></div></div>
    </section>`);
}
function showConfessionChoices() {
  if (!current) return;
  const box = current.querySelector('[data-choices]');
  box.innerHTML = `<div class="choices" role="group" aria-label="Your answer" tabindex="-1">
      <button type="button" class="btn pink big" data-choice="yes">YES ♡</button>
      <button type="button" class="btn cream big" data-choice="no">NO</button>
    </div>`;
  box.querySelector('[data-choice="yes"]').addEventListener('click', () => chooseEnding('happy'));
  box.querySelector('[data-choice="no"]').addEventListener('click', () => chooseEnding('honest'));
  later(() => focusKb(box.querySelector('.choices')), 60);
}
function chooseEnding(kind) {
  if (state.busy || state.ending) return;
  state.ending = kind;
  state.confessionAnswered = true;
  Sound.play(kind === 'happy' ? 'yes' : 'gentle');
  goTo(kind === 'happy' ? 'happyEnding' : 'honestEnding', kind === 'happy' ? 'pink' : 'fade');
}
function showEndCard(scene, o) {
  Dialogue.unmount();
  castJoin();
  setSprite('bunny', { mood: o.mood, prop: o.prop });
  setSprite('principal', { mood: o.principal });
  setSprite('ghost', { mood: o.ghost });
  const mount = scene.querySelector('[data-dlg]');
  const hearts = `<div class="end-hearts" aria-hidden="true"><span>${pixelSVG('heart')}</span><span>${pixelSVG('star')}</span><span>${pixelSVG('heart')}</span></div>`;
  mount.innerHTML = `<div class="end-card" role="group" aria-labelledby="endTitle">
      ${hearts}
      <h2 id="endTitle"><span class="num">${o.num}</span> <span>${o.title}</span></h2>
      ${castRow(o)}
      <p class="msg">${escapeHTML(o.msg)}</p>
      <button type="button" class="btn big ${o.btnClass}" data-action="replay">PLAY AGAIN</button>
    </div>`;
  const b = mount.querySelector('[data-action="replay"]');
  b.addEventListener('click', restart);
  announce(`${o.num} ${o.title}. Starring the principal, the ghost, ${BUNNY_NAME} and ${PLAYER_NAME}. ${o.msg}`);
  Sound.play(o.sound);
  later(() => focusKb(b), 90);
}
function vnScene(cls, label, bg, tag, extra = '', spriteCls = '') {
  return h(`<section class="scene scene-vn ${cls}" aria-label="${label}">
      <div class="bg">${bg}</div>
      ${extra}
      <div class="fx" data-fx></div>
      ${tag ? `<div class="top"><span class="tag">${tag}</span></div>` : ''}
      <div class="stage"><div class="sprite ${spriteCls}" data-sprite="bunny"><div class="anim"></div></div></div>
      <div class="bottom"><div data-choices></div><div data-dlg></div></div>
    </section>`);
}
function frameCorners() {
  return `<div class="frame" aria-hidden="true"><span class="c1">${pixelSVG('heart')}</span><span class="c2">${pixelSVG('star')}</span><span class="c3">${pixelSVG('star')}</span><span class="c4">${pixelSVG('heart')}</span></div>`;
}

      setupSprite(scene, 'principal', principalSVG, 'smile', {}, 'bob');
      setupSprite(scene, 'ghost', ghostSVG, 'smirk', {}, 'float');
      spawnFloaters(scene.querySelector('[data-fx]'), { count: 12, kinds: ['petal', 'sparkle'], mode: 'fall', min: 10, max: 16, opacity: 0.8 });
      Dialogue.mount(scene.querySelector('[data-dlg]'));
      scene.querySelector('.stage').addEventListener('click', () => Dialogue.advance());
      Dialogue.play(SCRIPT.honest(), () => showEndCard(scene, {
        num: 'ENDING 02:', title: 'THE HONEST ENDING', msg: HONEST_ENDING_MESSAGE,
        btnClass: '', mood: 'happy', prop: null, sound: 'gentle', principal: 'smile', ghost: 'smirk'
      }));
    }
  }
};


/* =============================================================
   13. FLOW, TRANSITIONS & RESTART
   ============================================================= */
const WIPE_COLS = 10, WIPE_ROWS = 8, WIPE_STEP = 18;

function buildWipe() {
  let html = '';
  for (let r = 0; r < WIPE_ROWS; r++) {
    for (let c = 0; c < WIPE_COLS; c++) html += `<i style="--d:${(c + r) * WIPE_STEP}ms"></i>`;
  }
  wipeEl.innerHTML = html;
}

// Scenes can only be entered in story order, so nothing can be skipped.
function canEnter(name) {
  switch (name) {
    case 'haunting':     return state.clues.size === CLUES.length;
    case 'trial':        return state.hauntingSeen;
    case 'lastDoor':     return state.trialComplete;
    case 'secretRoom':   return state.doorOpened;
    case 'confession':   return state.secretRoomSeen;
    case 'happyEnding':  return state.confessionAnswered && state.ending === 'happy';
    case 'honestEnding': return state.confessionAnswered && state.ending === 'honest';
    default:             return true;
  }
}

function transition(style, swap) {
  return new Promise(resolve => {
    if (style === 'none') { swap(); resolve(); return; }
    if (style === 'fade' || style === 'darkfade' || style === 'light' || REDUCED) {
      const tint = style === 'darkfade' ? ' dark' : style === 'light' ? ' light' : '';
      const ms = REDUCED ? 330 : style === 'darkfade' ? 650 : style === 'light' ? 450 : 330;
      wipeEl.className = 'fade active' + tint;
      void wipeEl.offsetWidth;
      wipeEl.classList.add('on');
      setTimeout(() => {
        swap();
        wipeEl.classList.remove('on');
        setTimeout(() => { wipeEl.className = ''; resolve(); }, ms);
      }, ms);
      return;
    }
    const total = (WIPE_COLS + WIPE_ROWS - 2) * WIPE_STEP + 220;
    wipeEl.className = style + ' cover active';
    setTimeout(() => {
      swap();
      wipeEl.className = style + ' reveal active';
      setTimeout(() => { wipeEl.className = ''; resolve(); }, total);
    }, total);
  });
}

function goTo(name, style = 'pixel') {
  if (state.busy) return false;
  if (!SCENES[name] || !canEnter(name)) return false;
  state.busy = true;
  if (style !== 'none') Sound.play('whoosh');
  transition(style, () => {
    clearTimers();
    Dialogue.stop();
    Object.keys(sprites).forEach(k => delete sprites[k]);
    sceneCleanup.splice(0).forEach(fn => fn());
    root.querySelectorAll('.scene, .fly, .burst').forEach(n => n.remove());
    state.scene = name;
    state.dialogueIndex = 0;
    const def = SCENES[name];
    const el = def.build();
    root.insertBefore(el, wipeEl);
    root.dataset.scene = name;
    current = el;
    Sound.music(SCENE_MUSIC[name]);
    def.enter(el);
  }).then(() => {
    state.busy = false;
    focusDefault();
  });
  return true;
}

function focusDefault() {
  if (!current || !keyboardMode) return;
  const t = current.querySelector('[data-autofocus]:not([disabled])');
  if (t) { t.focus({ preventScroll: true }); return; }
  const nb = Dialogue.nextBtn;
  if (Dialogue.canAdvance() && nb && nb.isConnected) nb.focus({ preventScroll: true });
}

// PLAY AGAIN: wipe every variable and return to the title screen.
function restart() {
  if (state.busy) return;
  state = freshState();
  pokeCount = 0;
  Sound.play('start');
  goTo('title', 'pixel');
}


/* =============================================================
   14. INPUT & BOOT
   ============================================================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ' || e.key.indexOf('Arrow') === 0) keyboardMode = true;
}, true);
document.addEventListener('pointerdown', () => { keyboardMode = false; }, true);

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target;
  if (t && t.closest && t.closest('button, a, input, textarea, select, [role="button"]')) return;
  if (Dialogue.canAdvance()) { e.preventDefault(); Dialogue.advance(); }
});

(function boot() {
  buildWipe();
  const icon = document.querySelector('link[rel="icon"]');
  if (icon) icon.href = 'data:image/svg+xml,' + encodeURIComponent(pixelSVG('door'));
  document.title = `${TITLE_MAIN} ${TITLE_SUB}`;
  root.setAttribute('aria-label', document.title);
  setupSoundButton();
  goTo('title', 'none');
})();
</script>
